const lerp=(a,b,t)=>a+(b-a)*t;

const wrapA=a=>{while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a};
const lerpC=(A,B,t)=>[A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t];
const rgb=a=>'rgb('+(a[0]|0)+','+(a[1]|0)+','+(a[2]|0)+')';
function hash2(ix,iy){
 let h=Math.imul(ix,73856093)^Math.imul(iy,19349663);
 h=Math.imul(h^(h>>>13),1274126177);
 return((h^(h>>>16))&1023)/1023;
}
function vnoise(x,y){
 const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
 const a=hash2(ix,iy),b=hash2(ix+1,iy),cc=hash2(ix,iy+1),d=hash2(ix+1,iy+1);
 const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
 return a+(b-a)*sx+(cc-a)*sy+(a-b-cc+d)*sx*sy;
}

/* ---------- terreno continuo ---------- */
function hAt(x,y){
 x=clamp(x,0,N-.001);y=clamp(y,0,N-.001);
 const ix=x|0,iy=y|0,fx=x-ix,fy=y-iy,i=iy*(N+1)+ix;
 const a=HG[i],b=HG[i+1],c2=HG[i+N+1],d=HG[i+N+2];
 return a+(b-a)*fx+(c2-a)*fy+(a-b-c2+d)*fx*fy;
}
const bioAt=(x,y)=>BIO[clamp(y|0,0,N-1)*N+clamp(x|0,0,N-1)];

function solid(x,y){
 if(x<.3||y<.3||x>N-.3||y>N-.3)return true;
 const cx=x|0,cy=y|0,i=cy*N+cx;
 if(!BR[i]&&hAt(x,y)<.03)return true;
 const b=BLK[i];if(b&&b!==6)return true;
 if(blocked.has(i))return true;
 for(const L of LM)if(Math.hypot(x-L.x,y-L.y)<L.r)return true;
 for(const P of POOLS)if(Math.hypot(x-P.x,y-P.y)<P.r)return true;
 return false;
}
const solidR=(x,y,r)=>solid(x-r,y-r)||solid(x+r,y-r)||solid(x-r,y+r)||solid(x+r,y+r);
function move(dx,dy){
 const nx=player.x+dx,ny=player.y+dy;
 if(!solidR(nx,player.y,.22))player.x=nx;
 if(!solidR(player.x,ny,.22))player.y=ny;
}
function nearLava(x,y){
 for(const P of POOLS)if(Math.hypot(x-P.x,y-P.y)<P.r+.35)return true;
 return false;
}

/* ---------- generacion del mundo ---------- */
function genTerrain(){
 const ox=rnd()*200,oy=rnd()*200;
 for(let y=0;y<=N;y++)for(let x=0;x<=N;x++){
  let best=-9;
  for(const I of CEN){
   const dx=x-I.x,dy=y-I.y,d=Math.hypot(dx,dy),an=Math.atan2(dy,dx);
   const R=I.R*(1+.09*Math.sin(an*3+ox)+.06*Math.sin(an*5+oy)+.04*Math.sin(an*9+ox*.7));
   best=Math.max(best,1-d/R);
  }
  HG[y*(N+1)+x]=best+(vnoise(x*.16+ox,y*.16+oy)-.5)*.2;
 }
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  let bi=0,bd=1e9;
  for(let k=0;k<4;k++){const d=Math.hypot(x+.5-CEN[k].x,y+.5-CEN[k].y);if(d<bd){bd=d;bi=k}}
  BIO[y*N+x]=bi;
 }
 BR.fill(0);BLK.fill(0);BLH.fill(0);FLR.fill(0);
 const links=[[0,1],[0,2],[1,3],[2,3]];
 for(const [a,b] of links){
  const A=CEN[a],B=CEN[b];
  if(A.y===B.y){
   for(let x=A.x;x<=B.x;x++)for(let y=A.y-1;y<=A.y+1;y++)
    if(hAt(x+.5,y+.5)<.1)BR[y*N+x]=1;
  }else{
   for(let y=A.y;y<=B.y;y++)for(let x=A.x-1;x<=A.x+1;x++)
    if(hAt(x+.5,y+.5)<.1)BR[y*N+x]=2;
  }
 }
 LM=[
  {x:CEN[0].x,y:CEN[0].y,r:2.6,kind:'peak'},
  {x:CEN[1].x,y:CEN[1].y,r:3.6,kind:'volcano'},
  {x:CEN[2].x,y:CEN[2].y,r:1.1,kind:'bigtree'},
  {x:CEN[3].x,y:CEN[3].y,r:2.6,kind:'pyramid'}];
 POOLS=[];
 const angs=[-2.4,-1.2,-.2,.6];
 for(const an of angs){
  const d=8+rnd()*3;
  POOLS.push({x:CEN[1].x+Math.cos(an)*d,y:CEN[1].y+Math.sin(an)*d,r:1.4+rnd()*.8});
 }
}

function makeMiniMap(){
 const mc=document.createElement('canvas');mc.width=N;mc.height=N;
 const m=mc.getContext('2d'),im=m.createImageData(N,N),d=im.data;
 const land=[[226,236,244],[74,64,66],[78,132,70],[226,196,128]];
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  const h=hAt(x+.5,y+.5),i=(y*N+x)*4;
  let col;
  if(BR[y*N+x])col=[150,104,62];
  else if(h<0)col=h<-.35?[22,60,120]:[40,120,170];
  else if(h<.16)col=[220,200,150];
  else col=land[BIO[y*N+x]];
  d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=255;
 }
 for(const P of POOLS){
  const x=P.x|0,y=P.y|0,i=(y*N+x)*4;d[i]=255;d[i+1]=110;d[i+2]=30;
 }
 m.putImageData(im,0,0);
 return mc;
}

const GL={};
for(const k in FONT_SRC){
 const rows=FONT_SRC[k].split('/'),pts=[];

const ACC={'Ã':'A','Ã‰':'E','Ã':'I','Ã“':'O','Ãš':'U','Ãœ':'U','Ã‘':'N'};
function textW(s,sc){return Math.max(0,s.length*6-1)*sc}
function drawText(s,x,y,sc,col,o){
 o=o||{};s=String(s).toUpperCase();
 if(o.align==='c')x-=textW(s,sc)/2;else if(o.align==='r')x-=textW(s,sc);
 x=Math.round(x);y=Math.round(y);
 const pass=(ox,oy,cl)=>{
  g.fillStyle=cl;
  let cx=x+ox;
  for(let i=0;i<s.length;i++){
   let ch=s[i],acc=0;
   if(ACC[ch]){acc=ch==='Ã‘'?2:1;ch=ACC[ch]}
   const pts=GL[ch];
   if(pts)for(let k=0;k<pts.length;k+=2)g.fillRect(cx+pts[k]*sc,y+oy+pts[k+1]*sc,sc,sc);
   if(acc===1)g.fillRect(cx+3*sc,y+oy-2*sc,sc,sc);

/* ---------- audio ---------- */
let AC=null,NB=null;
function audio(){
 if(!snd)return null;
 try{
  if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(A)AC=new A()}
  if(AC&&AC.state==='suspended')AC.resume();
 }catch(e){}
 return AC;
}
function tone(f,d,type,vol,slide){
 const a=audio();if(!a)return;
 try{
  const o=a.createOscillator(),v=a.createGain(),t=a.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);
  v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(v);v.connect(a.destination);o.start();o.stop(t+d+.02);
 }catch(e){}
}
function noise(d,vol,fq){
 const a=audio();if(!a)return;
 try{
  if(!NB){
   NB=a.createBuffer(1,(a.sampleRate*.8)|0,a.sampleRate);
   const ch=NB.getChannelData(0);
   for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;
  }
  const s=a.createBufferSource(),fl=a.createBiquadFilter(),v=a.createGain(),t=a.currentTime;
  s.buffer=NB;fl.type='lowpass';fl.frequency.value=fq;
  v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(fl);fl.connect(v);v.connect(a.destination);s.start();s.stop(t+d);
 }catch(e){}
}
function sfx(k){
 if(k==='wood'){tone(140,.12,'triangle',.12,.6);noise(.08,.1,1800)}
 else if(k==='stone'){tone(720,.08,'square',.04,.5);noise(.1,.12,3500)}
 else if(k==='fall'){noise(.55,.18,600);tone(180,.5,'sawtooth',.03,.4)}
 else if(k==='thud'){tone(70,.35,'sine',.28,.5);noise(.3,.2,300)}
 else if(k==='break'){noise(.5,.25,2600);tone(220,.22,'sawtooth',.05,.4)}
 else if(k==='pick'){tone(900,.09,'sine',.06,1.6)}
 else if(k==='chof'){tone(95,.15,'sine',.14);noise(.12,.12,900)}
 else if(k==='tink'){tone(1100,.07,'square',.03,.6)}
 else if(k==='whiff'){noise(.1,.06,2200)}
 else if(k==='place'){tone(200,.08,'square',.06,.7);noise(.05,.08,1200)}
 else if(k==='craft'){tone(520,.08,'triangle',.07,1.5);setTimeout(()=>tone(780,.12,'triangle',.07,1.3),80)}
 else if(k==='splash'){noise(.25,.07,2200)}
 else if(k==='wave'){noise(1.1,.035,650)}
 else if(k==='step'){noise(.05,.03,900)}
 else if(k==='jump'){tone(260,.1,'sine',.05,1.8)}
 else if(k==='horse'){tone(320,.18,'sawtooth',.04,.5);noise(.12,.05,1400)}
 else if(k==='ui'){tone(660,.05,'square',.03,1.2)}
 else if(k==='hurt'){tone(160,.25,'sawtooth',.08,.5)}
}

/* ---------- particulas 3D (trozos que se deshacen en pixeles) ---------- */
function addP(x,y,z,vx,vy,vz,s,col,lvl){
 if(parts.length>1800)return;
 parts.push({x,y,z,vx,vy,vz,s,col,lvl,st:0,t:0,a:1,b:0});
}
const jit=cl=>[clamp(cl[0]+(Math.random()-.5)*22,0,255),clamp(cl[1]+(Math.random()-.5)*22,0,255),clamp(cl[2]+(Math.random()-.5)*22,0,255)];
function updateParts(){
 for(let i=parts.length-1;i>=0;i--){
  const p=parts[i];
  if(p.st===0){
   p.vz-=.006;
   const nx=p.x+p.vx,ny=p.y+p.vy;
   p.x=nx;p.y=ny;p.z+=p.vz;
   if(p.z<=0){
    p.z=0;p.vz=-p.vz*.35;p.vx*=.55;p.vy*=.55;p.b++;
    if(p.b>=2||p.vz<.012){
     p.st=1;p.vz=0;p.vx=0;p.vy=0;
     p.t=p.lvl===0?30+Math.random()*50:p.lvl===1?20+Math.random()*30:10+Math.random()*25;
    }
   }
  }else if(p.st===1){
   if(--p.t<=0){
    if(p.lvl<2){
     const h=p.s/2;
     for(let k=0;k<4;k++)
      addP(p.x+((k&1)?h/2:-h/2),p.y+((k&2)?h/2:-h/2),p.z,
       (Math.random()-.5)*.012,(Math.random()-.5)*.012,.015+Math.random()*.025,
       h,jit(p.col),p.lvl+1);
     parts.splice(i,1);
    }else p.st=2;
   }
  }else{

let _r=0,_g=0,_b=0,_w=0;

function groundRGB(b,wx,wy,n,detail,wt){
 if(b===2){

 }else if(b===0){
  _r=206+30*n;_g=222+22*n;_b=240+12*n;
  if(n<.4){const k=(.4-n)*2.2;_r-=44*k;_g-=28*k;_b-=8*k}
  if(detail){const t=hash2(Math.floor(wx*7),Math.floor(wy*7));
   if(t>.95){_r+=20;_g+=20;_b+=14}else if(t<.06){_r-=24;_g-=14}}
 }else if(b===3){
  const rip=Math.sin(wx*.9+wy*.45+n*7)*.5+.5;

   if(t>.93){_r-=22;_g-=22;_b-=18}}
 }else{

   const f=.55+.45*Math.sin(wt*2.2+wx*1.3+wy);
   _r=240;_g=70+90*f;_b=20;
  }else if(n>.7){_r+=26;_g+=24;_b+=22}

function floorPix(wx,wy,dp,detail,wt){

  const along=br===1?wx:wy,cross=br===1?wy:wx;
  const pl=Math.floor(along*2),sv=hash2(pl,br*7+(br===1?iy:ix));

const RC={dist:0,hit:0,side:0,tx:0,cx:0,cy:0};
function castDir(dx,dy){
 let mx=Math.floor(player.x),my=Math.floor(player.y);
 const ddx=Math.abs(1/(dx||1e-9)),ddy=Math.abs(1/(dy||1e-9));
 let stx,sty,sdx,sdy;
 if(dx<0){stx=-1;sdx=(player.x-mx)*ddx}else{stx=1;sdx=(mx+1-player.x)*ddx}
 if(dy<0){sty=-1;sdy=(player.y-my)*ddy}else{sty=1;sdy=(my+1-player.y)*ddy}
 let side=0,hit=0,n=0;
 while(n++<60){
  if(sdx<sdy){if(sdx>26)break;sdx+=ddx;mx+=stx;side=0}else{if(sdy>26)break;sdy+=ddy;my+=sty;side=1}
  if(mx<0||my<0||mx>=N||my>=N)break;
  const v=BLK[my*N+mx];
  if(v&&v!==6){hit=v;break}
 }
 const dist=side===0?sdx-ddx:sdy-ddy;
 let t=side===0?player.y+dist*dy:player.x+dist*dx;
 t-=Math.floor(t);
 RC.dist=dist;RC.hit=hit;RC.side=side;RC.tx=t;RC.cx=mx;RC.cy=my;
 return RC;
}

function updateFish(){
 /* mantener un banco de peces alrededor del jugador, solo en agua */
 while(fish.length<30){
  const a=Math.random()<.7?player.a+(Math.random()-.5)*1.7:Math.random()*6.283,r=3+Math.random()*14,x=player.x+Math.cos(a)*r,y=player.y+Math.sin(a)*r;

  if(h>-.07||BR[(y|0)*N+(x|0)]){if(Math.random()<.7)break;continue}
  const dol=h<-.28&&r>6&&Math.random()<.08&&fish.filter(q=>q.sp==='dolphin').length<2;
  fish.push({x,y,dir:Math.random()*6.283,sp:dol?'dolphin':(Math.random()<.35?'koi':'fish'),
   state:'swim',jt:150+Math.random()*600,t:0,z:0,vz:0,fv:.03});
  break;
 }
 for(let i=fish.length-1;i>=0;i--){
  const f=fish[i];
  if(Math.hypot(f.x-player.x,f.y-player.y)>21){fish.splice(i,1);continue}
  if(f.state==='swim'){
   if(Math.random()<.02)f.dir+=(Math.random()-.5)*1.6;
   const sp=f.sp==='dolphin'?.02:.012,nx=f.x+Math.cos(f.dir)*sp,ny=f.y+Math.sin(f.dir)*sp;
   if(hAt(nx,ny)<-.06&&!BR[(ny|0)*N+(nx|0)]){f.x=nx;f.y=ny}else f.dir+=Math.PI*(.6+Math.random()*.8);
   if(--f.jt<=0&&hAt(f.x,f.y)<-.1){
    f.state='jump';f.t=0;
    f.vz=f.sp==='dolphin'?.09:.06;f.fv=f.sp==='dolphin'?.05:.036;f.z=0;
    splash(f.x,f.y,f.sp==='dolphin'?12:6);
   }
  }else{
   f.t++;f.vz-=.0032;f.z+=f.vz;
   f.x+=Math.cos(f.dir)*f.fv;f.y+=Math.sin(f.dir)*f.fv;
   if(f.z<=0){
    f.z=0;f.state='swim';f.jt=200+Math.random()*700;

    ripples.push({x:f.x,y:f.y,t:0});
    if(Math.random()<.4)sfx('splash');
   }
  }
 }
 for(let i=ripples.length-1;i>=0;i--)if(++ripples[i].t>50)ripples.splice(i,1);
}

/* ---------- lista de elementos y oclusion ---------- */
const RUNS=[];
function occlusion(x0,x1,perp){
 x0=Math.max(0,Math.floor(x0));x1=Math.min(W-1,Math.ceil(x1));
 RUNS.length=0;
 let start=-1,any=false,all=true;
 for(let x=x0;x<=x1;x++){
  if(zbuf[x]>perp-.12){any=true;if(start<0)start=x}
  else{all=false;if(start>=0){RUNS.push(start,x-start);start=-1}}
 }
 if(start>=0)RUNS.push(start,x1-start+1);
 return !any?0:(all?1:2);
}
const SWD={tree:.9,rock:.85,plant:.3,animal:.6,bush:.7,shroom:.2,pebble:.15,placed:.8};
function hwOf(o){
 if(o.type==='tree')return o.kind==='palm'?1.1:o.kind==='cactus'?.5:.62;
 if(o.type==='rock')return .48;
 if(o.type==='animal')return (ANI[o.kind]?.hw||.4)+.1;
 if(o.type==='bush')return .4;
 if(o.type==='placed')return .5;
 return .26;
}

 if(zbuf[clamp(Math.round(sx),0,W-1)]<perp-.1)return;
 g.strokeStyle='rgba(240,252,255,'+(.7*(1-k))+')';g.lineWidth=1;
 g.strokeRect(Math.round(sx-rad)+.5,Math.round(gy-ry/2)+.5,Math.round(rad*2),Math.max(1,Math.round(ry)));

function drawFishItem(f,it){

 if(zbuf[clamp(Math.round(sx),0,W-1)]<perp-.1)return;

 const lat=Math.cos(f.dir)*-SP+Math.sin(f.dir)*CP,face=lat>=0?1:-1;

function randCell(b,minH,maxH){
 const I=CEN[b];
 for(let t=0;t<90;t++){
  const a=rnd()*6.283,r=Math.sqrt(rnd())*I.R*1.02;
  const x=Math.floor(I.x+Math.cos(a)*r),y=Math.floor(I.y+Math.sin(a)*r);
  if(x<2||y<2||x>=N-2||y>=N-2)continue;
  const i=y*N+x;
  if(BIO[i]!==b||BR[i]||occ.has(i))continue;
  const h=hAt(x+.5,y+.5);
  if(h<minH||h>maxH)continue;
  if(Math.hypot(x+.5-spawn.x,y+.5-spawn.y)<3)continue;
  let bad=false;
  for(const L of LM)if(Math.hypot(x+.5-L.x,y+.5-L.y)<L.r+1.3){bad=true;break}
  if(!bad)for(const Q of POOLS)if(Math.hypot(x+.5-Q.x,y+.5-Q.y)<Q.r+1.5){bad=true;break}
  if(bad)continue;
  occ.add(i);return [x,y];
 }
 return null;
}

  drawText('FRONTERA DE 4 ISLAS',320,222,2,'#cfe6f8',{align:'c',outline:'#08101f'});
  drawText('NIEVE Â· VOLCAN Â· BOSQUE Â· DESIERTO'.replace(/Â·/g,'-'),320,246,1,'#8fb0cc',{align:'c'});
  g.globalAlpha=1;
 }
 if(t>60&&Math.floor(t/28)%2===0)drawText('TOCA PARA JUGAR',320,288,2,'#ffffff',{align:'c',outline:'#08101f'});
 drawText('MOVER: JOYSTICK / WASD   MIRAR: ARRASTRA   GOLPEAR: F',320,332,1,'#7f95aa',{align:'c'});
}

/* ---------- render principal ---------- */
function render(){
 const dayT=((performance.now()-dayStarted)%DAY)/DAY,daylight=(Math.cos(dayT*Math.PI*2)+1)/2,night=1-daylight;
 DAYT=dayT;DLIGHT=daylight;NIGHT=night;
 CP=Math.cos(player.a);SP=Math.sin(player.a);
 CAMH=.5+player.z+(mounted?.32:0);
 g.save();
 if(camShake>0)g.translate((Math.random()-.5)*camShake*.8,(Math.random()-.5)*camShake*.8);
 drawSky(dayT,daylight,night);
 FOG=HZ;
 {const dusk=Math.max(0,1-Math.abs(daylight-.5)*4);FOG=lerpC(HZ,[255,170,110],dusk*.55)}
 drawFloor();
 drawWalls();
 drawItems();
 drawInsects(false);
 g.restore();
 if(state==='play'){
  if(mounted)drawHorseHead();
  drawHeld();
 }
 if(night>.02){g.fillStyle='rgba(8,15,48,'+(night*.5)+')';g.fillRect(0,0,W,H)}
 const dusk=Math.max(0,1-Math.abs(daylight-.5)*4.5);
 if(dusk>0){g.fillStyle='rgba(255,140,60,'+(dusk*.14)+')';g.fillRect(0,0,W,H)}
 drawInsects(true);
 const vg=g.createRadialGradient(W/2,H/2,65,W/2,H/2,390);
 vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.34)');
 g.fillStyle=vg;g.fillRect(0,0,W,H);
 if(state==='play'&&!menu){
  drawFx();drawCross();drawTargetLabel();drawHUD();
 }
 if(state==='title')drawTitle();
 if(menu){HIT.length=0;drawMenu()}
 if(sleepT>0){
  const a=sleepT>100?(120-sleepT)/20:sleepT<40?sleepT/40:1;
  g.fillStyle='rgba(0,0,0,'+clamp(a,0,1)+')';g.fillRect(0,0,W,H);
  if(a>.5)drawText('ZZZ',320,160,6,'#bfe6ff',{align:'c'});
 }
 if(fade>0){g.fillStyle='rgba(0,0,0,'+fade+')';g.fillRect(0,0,W,H)}
}

/* ---------- actualizacion ---------- */
function updateAnimals(){
 for(const a of objects){
  if(a.type!=='animal')continue;
  if(a.hurt>0)a.hurt--;
  const A=ANI[a.kind];
  const dx=a.x-player.x,dy=a.y-player.y,d=Math.hypot(dx,dy);
  let sp=A.spd;a.mv=false;
  if(a.tamed&&a.kind==='horse'){if(a.idle>0)a.idle--;continue}
  if(d<3.4&&a.kind!=='lizard'){
   a.dir=Math.atan2(dy,dx)+Math.sin(a.phase)*.4;sp*=3;a.turn=30;a.idle=0;
  }else{
   if(a.idle>0){a.idle--;continue}
   if(--a.turn<=0){a.dir+=(Math.random()-.5)*2.8;a.turn=45+Math.floor(Math.random()*180);if(Math.random()<.4)a.idle=40+Math.floor(Math.random()*80)}
  }
  const nx=a.x+Math.cos(a.dir)*sp,ny=a.y+Math.sin(a.dir)*sp;
  const bad=solid(nx,ny)||BIO[(ny|0)*N+(nx|0)]!==BIO[(a.y|0)*N+(a.x|0)]&&false;
  if(!bad){a.x=nx;a.y=ny;a.phase+=sp*14;a.mv=true}
  else a.dir+=Math.PI*(.5+Math.random());
 }
}
function updateObjects(){
 for(let i=objects.length-1;i>=0;i--){
  const o=objects[i];
  if(o.shake>0)o.shake--;
  if(o.state==='falling'){
   o.fallT++;
   const t=Math.min(1,o.fallT/FALL_FR),ang=Math.pow(t,2.2)*Math.PI/2;
   if(o.fallT%3===0){
    const L=1.15*o.sc,s=Math.sin(ang)*L*o.fallDir;
    addP(o.x+o.fv[0]*s+(Math.random()-.5)*.6,o.y+o.fv[1]*s+(Math.random()-.5)*.6,Math.cos(ang)*L+.1,(Math.random()-.5)*.01,(Math.random()-.5)*.01,0,.06,pick(PART_PAL[o.kind]),2);
   }
   if(t>=1){landTree(o);objects.splice(i,1)}
   continue;
  }
  if(o.kind==='crop'&&o.age<GROW)o.age++;
  if(o.type==='bush'&&!o.berries&&o.bio!==undefined&&--o.regrow<=0)o.berries=true;
 }
 for(let i=deco.length-1;i>=0;i--){const d=deco[i];if(d.type==='blood'&&--d.life<=0)deco.splice(i,1)}
}
function updateInsects(){
 for(const b of insects){
  b.phase+=b.speed;
  if(b.fire&&Math.hypot(b.hx-player.x,b.hy-player.y)>12){
   const a=Math.random()*6.283,r=3+Math.random()*8;
   b.hx=player.x+Math.cos(a)*r;b.hy=player.y+Math.sin(a)*r;
  }
  b.x=b.hx+Math.sin(b.phase*2)*b.r;b.y=b.hy+Math.cos(b.phase*1.4)*b.r*.8;
 }
}
const joy={x:0,y:0};
function jump(){
 if(state!=='play'||menu)return;
 if(player.z<=.001){player.vz=mounted?.092:.076;sfx('jump')}
}
function update(){
 frame++;
 if(state==='title'){titleT++;player.a+=.0028;updateFish();updateParts();updateInsects();for(const cl of clouds)cl.az+=.0003;for(const b of birds)b.az+=b.sp;return}
 if(cool>0)cool--;
 if(camShake>0)camShake--;
 if(fade>0)fade=Math.max(0,fade-.025);
 if(sleepT>0)sleepT--;
 if(toolSwing>0&&!dbgHold){
  toolSwing--;
  if(!swingHit&&toolSwing<=SWING_FR*.55){swingHit=true;doHit()}
 }
 let mv=false;
 if(!menu&&sleepT<=0){
  if(keys.arrowleft)player.a-=.045;
  if(keys.arrowright)player.a+=.045;
  const ca=CP,sa=SP;
  let spd=1;
  const wantRun=(keys.shift||runToggle);
  const ride=mounted?1.9:1;
  let fx=0,fy=0;
  if(keys.w||keys.arrowup)fy+=1;
  if(keys.s||keys.arrowdown)fy-=.85;
  if(keys.a)fx-=.8;
  if(keys.d)fx+=.8;
  if(Math.abs(joy.y)>.08)fy+=-joy.y;
  if(Math.abs(joy.x)>.08)fx+=joy.x*.85;
  mv=Math.abs(fx)+Math.abs(fy)>.05;
  sprint=wantRun&&mv&&stam>2;
  if(sprint)spd=1.75;
  if(mv){
   const len=Math.hypot(fx,fy);if(len>1){fx/=len;fy/=len}
   const k=.075*spd*ride;
   move(ca*fy*k-sa*fx*k*.87,sa*fy*k+ca*fx*k*.87);
  }
  if(sprint)stam=Math.max(0,stam-.45);else stam=Math.min(100,stam+(mv?.12:.3));
  if(!wantRun&&stam<=2)stam=3;
  if(keys.f||keys.enter||atkHeld)attack();
 }
 moving=mv;
 player.vz-=.0065;player.z+=player.vz;
 if(player.z<=0){
  if(player.vz<-.05){camShake=Math.max(camShake,3);sfx('step')}
  player.z=0;player.vz=0;
 }
 if(mv&&player.z<=.001&&frame-lastStep>(sprint?9:mounted?11:16)){lastStep=frame;sfx(mounted?'step':'step')}
 /* lava */
 if(nearLava(player.x,player.y)&&frame%36===0){
  hp-=2;camShake=6;sfx('hurt');say('Â¡LAVA! TE QUEMAS');
  const P0=POOLS.find(P=>Math.hypot(player.x-P.x,player.y-P.y)<P.r+.35);
  if(P0){const a=Math.atan2(player.y-P0.y,player.x-P0.x);move(Math.cos(a)*.5,Math.sin(a)*.5)}
  if(hp<=0)die();
 }
 if(hp<10&&hp>0&&frame%420===0)hp++;
 /* bioma actual */
 if(hAt(player.x,player.y)>.1){
  const b=bioAt(player.x,player.y);
  if(b!==curBio){if(curBio!==-1||state==='play'){banner=BN[b];bannerT=140}curBio=b}
 }
 /* mar */
 if(frame%210===0&&hAt(player.x,player.y)<.5&&Math.random()<.6)sfx('wave');
 updateAnimals();updateObjects();updateInsects();updateFish();updateParts();
 for(const cl of clouds)cl.az+=.0003;
 for(const b of birds)b.az+=b.sp;
}

/* ---------- hotbar y UI DOM ---------- */
const ui=document.getElementById('ui'),hotbar=document.getElementById('hotbar');
let slots=[];
function buildHotbar(){
 hotbar.innerHTML='';slots=[];
 for(let i=1;i<=6;i++){
  const b=document.createElement('button');b.className='slot';b.dataset.i=i;
  const cv=document.createElement('canvas');cv.width=16;cv.height=16;
  const n=document.createElement('i');n.textContent=i===6?'B':i;
  const k=document.createElement('b');
  b.appendChild(cv);b.appendChild(n);b.appendChild(k);hotbar.appendChild(b);
  slots.push({b,cv,k});
  b.addEventListener('pointerdown',e=>{
   e.preventDefault();e.stopPropagation();
   if(i===6){openMenu({type:'inv'});return}
   if(i===5){
    const owned=ORDER.filter(x=>ITEMS[x].k==='place'&&have(x)>0);
    if(!owned.length){say('NO TIENES NADA PARA COLOCAR');tool=1}
    else if(tool===5){const j=owned.indexOf(held);held=owned[(j+1)%owned.length]}
    else{if(!owned.includes(held))held=owned[0];tool=5}
   }else tool=i;
   updateHotbar();sfx('ui');
  });
 }
}
function updateHotbar(){
 if(!slots.length)return;
 const ids=['axe','pick','seeds','knife',held];
 slots.forEach((s,i)=>{
  const x=s.cv.getContext('2d');x.clearRect(0,0,16,16);
  if(i<5){
   const id=i===4?(have(held)>0?held:null):ids[i];
   if(id)drawIcon(0,0,1,id,x);
   s.k.textContent=i===2?have('seeds'):i===4&&have(held)>0?have(held):'';
   s.b.classList.toggle('sel',tool===i+1);
  }else{
   drawIcon(0,0,1,'leather',x);x.fillStyle='#8a5a30';x.fillRect(3,3,10,10);x.fillStyle='#b98550';x.fillRect(4,4,8,3);x.fillStyle='#46301c';x.fillRect(5,8,6,1);
   s.k.textContent='';
  }
 });
}
function uiShow(){
 ui.style.display=(state==='play'&&!menu)?'block':'none';
}
function layout(){
 const r=c.getBoundingClientRect();
 const sc=Math.min(r.width/W,r.height/H),w=W*sc,h=H*sc;
 ui.style.left=(r.left+(r.width-w)/2)+'px';ui.style.top=(r.top+(r.height-h)/2)+'px';
 ui.style.width=w+'px';ui.style.height=h+'px';
 ui.style.setProperty('--s',(h/100)+'px');
}
window.addEventListener('resize',layout);
window.addEventListener('orientationchange',()=>setTimeout(layout,200));
function toCanvas(e){
 const r=c.getBoundingClientRect(),sc=Math.min(r.width/W,r.height/H);
 return {x:(e.clientX-r.left-(r.width-W*sc)/2)/sc,y:(e.clientY-r.top-(r.height-H*sc)/2)/sc};
}

/* ---------- entrada ---------- */
function startGame(){
 if(state!=='title')return;
 state='play';fade=1;audio();
 dayStarted=performance.now()-DAY*.9;
 player.a=Math.atan2(CEN[2].y-spawn.y,CEN[2].x-spawn.x)+.5;
 uiShow();updateHotbar();
 curBio=-1;
 say('GOLPEA ARBOLES CON EL HACHA (1): 3 GOLPES');
}
c.addEventListener('pointerdown',e=>{
 audio();
 if(state==='title'&&titleT>25){startGame();return}
 if(!menu)return;
 const p=toCanvas(e);
 for(let i=HIT.length-1;i>=0;i--){
  const h=HIT[i];
  if(p.x>=h.x&&p.x<h.x+h.w&&p.y>=h.y&&p.y<h.y+h.h){h.fn();break}
 }
});
window.addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(state==='title'){if(titleT>25&&(k===' '||k==='enter'||k==='e')){startGame();e.preventDefault()}return}
 keys[k]=true;
 if(e.key==='Shift')keys.shift=true;
 if(['arrowleft','arrowright','arrowup','arrowdown',' ','tab'].includes(k))e.preventDefault();
 if(menu){if(k==='escape'||k==='b'||k==='tab')closeMenu();return}
 if(k>='1'&&k<='5'){tool=Number(k);if(tool===5){const o=ORDER.filter(x=>ITEMS[x].k==='place'&&have(x)>0);if(!o.length){tool=1;say('NO TIENES NADA PARA COLOCAR')}else if(!o.includes(held))held=o[0]}updateHotbar()}
 if(k==='q'){const o=ORDER.filter(x=>ITEMS[x].k==='place'&&have(x)>0);if(o.length){held=o[(o.indexOf(held)+1)%o.length];tool=5;updateHotbar()}}
 if(k==='e'&&!e.repeat)interact();
 if(k===' '&&!e.repeat)jump();
 if((k==='f'||k==='enter')&&!e.repeat)attack();
 if(k==='b'||k==='tab')openMenu({type:'inv'});
 if(k==='n'&&!e.repeat)newWorld();
 if(k==='m'){snd=!snd;say(snd?'SONIDO ACTIVADO':'SONIDO APAGADO')}
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key==='Shift')keys.shift=false});
function newWorld(){
 if(performance.now()<newArm){fresh();state='play';uiShow();fade=1;newArm=0;return}
 newArm=performance.now()+3000;say('PULSA OTRA VEZ PARA CREAR UN MUNDO NUEVO');
}
const joystick=document.getElementById('joy'),stick=document.getElementById('stick');
let joyPointer=null;
function joystickMove(e){
 const r=joystick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
 const max=r.width*.36,len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 joy.x=dx/max;joy.y=dy/max;
 stick.style.transform='translate('+dx+'px,'+dy+'px)';
}
joystick.addEventListener('pointerdown',e=>{e.preventDefault();joyPointer=e.pointerId;joystick.setPointerCapture(e.pointerId);joystickMove(e)});
joystick.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)joystickMove(e)});
function stopJoy(){joyPointer=null;joy.x=0;joy.y=0;stick.style.transform='translate(0,0)'}
joystick.addEventListener('pointerup',stopJoy);joystick.addEventListener('pointercancel',stopJoy);
const look=document.getElementById('look');
let lookPointer=null,lastX=0,downT=0,downX=0,downY=0,moved=0;
look.addEventListener('pointerdown',e=>{lookPointer=e.pointerId;lastX=e.clientX;downT=performance.now();downX=e.clientX;downY=e.clientY;moved=0;look.setPointerCapture(e.pointerId)});
look.addEventListener('pointermove',e=>{
 if(e.pointerId!==lookPointer)return;
 player.a+=(e.clientX-lastX)*.009;lastX=e.clientX;
 moved=Math.max(moved,Math.hypot(e.clientX-downX,e.clientY-downY));
});
look.addEventListener('pointerup',e=>{
 if(e.pointerId===lookPointer&&moved<9&&performance.now()-downT<260)attack();
 lookPointer=null;
});
look.addEventListener('pointercancel',()=>{lookPointer=null});
function hold(id,down,up){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();el.classList.add('on');down()});
 const off=()=>{el.classList.remove('on');if(up)up()};
 el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);
}
hold('atk',()=>{atkHeld=true;attack()},()=>{atkHeld=false});
hold('use',interact);
hold('jmp',jump);
document.getElementById('run').addEventListener('pointerdown',e=>{
 e.preventDefault();e.stopPropagation();runToggle=!runToggle;e.currentTarget.classList.toggle('lock',runToggle);
});
document.getElementById('tnew').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();newWorld()});
document.getElementById('tsnd').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();snd=!snd;e.currentTarget.textContent=snd?'SONIDO':'SILENCIO'});
document.getElementById('tfs').addEventListener('pointerdown',e=>{
 e.preventDefault();e.stopPropagation();
 try{
  const d=document.documentElement;
  if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);
  else(d.requestFullscreen||d.webkitRequestFullscreen).call(d);
 }catch(er){}
});
window.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- bucle ---------- */
let last=performance.now(),acc=0;
function loop(now){
 if(typeof now!=='number')now=performance.now();
 acc+=Math.min(100,now-last);last=now;
 let n=0;
 while(acc>=STEP&&n<5){update();acc-=STEP;n++}
 if(n===5)acc=0;
 render();
 requestAnimationFrame(loop);
}
buildModels();buildHotbar();fresh();layout();uiShow();
if(location.hash==='#debug')window.__PP={
 get player(){return player},objects:()=>objects,inv,give,attack,startGame,interact,jump,fresh,
 setTool:t=>{tool=t;updateHotbar()},setHeld:h=>{held=h},tp:(x,y,a)=>{player.x=x;player.y=y;if(a!==undefined)player.a=a},
 setTime:t=>{dayStarted=performance.now()-DAY*t},openMenu,closeMenu,craft,RECIPES,doHit,hAt,BR,BLK,CEN,LM,POOLS,
 state:()=>state,keys,spawn:()=>spawn,mount:o=>mountHorse(o),getHp:()=>hp,fish:()=>fish,setTitleT:v=>{titleT=v},setSwing:p=>{dbgHold=true;swingHit=true;toolSwing=Math.max(1,Math.round((1-p)*SWING_FR))},release:()=>{dbgHold=false}};
requestAnimationFrame(loop);
})();
</script>

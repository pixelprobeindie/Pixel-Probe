<script>
/* DETECTOR DE ERRORES */
window.addEventListener('error',e=>{
 const h=document.getElementById('hud');
 if(h)h.textContent='ERROR: '+e.message;
 const c=document.getElementById('v');
 if(c){
  const g=c.getContext('2d');
  g.fillStyle='#160000';g.fillRect(0,0,640,360);
  g.fillStyle='white';g.font='14px monospace';
  g.fillText('ERROR DEL MOTOR:',20,35);
  g.fillText(String(e.message).substring(0,75),20,65);
 }
});

(()=>{
'use strict';
/* =========================================================
   PIXEL PROBE — motor raycaster con sprites anclados al suelo
   Todo el arte es procedural (rectángulos) y original.
   ========================================================= */
const c=document.getElementById('v'),
g=c.getContext('2d'),
hud=document.getElementById('hud');
const W=640,H=360,HH=H/2,FOV=Math.PI/2.8;
g.imageSmoothingEnabled=false;

const mapW=64,mapH=64,keys={};
let map=[],objects=[],deco=[],insects=[],player={x:32.5,y:32.5,a:0};
const parts=[],blocked=new Set();
let seed=1,tool=1,wood=0,stone=0,seeds=5,food=0,hp=5,
msg='',msgT=0,frame=0,toolSwing=0,cool=0,camShake=0,
hitText='',hitTextT=0,moving=false,snd=true,atkHeld=false;
const DAY_LENGTH=300000,GROW=900,FALL_FR=48,STEP=1000/60;
let dayStarted=performance.now();
let CP=1,SP=0,FOG=[150,186,172];

const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[(Math.random()*a.length)|0];
const wrapA=a=>{while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a};
const lerp=(a,b,t)=>a+(b-a)*t;
const lerpC=(A,B,t)=>[lerp(A[0],B[0],t),lerp(A[1],B[1],t),lerp(A[2],B[2],t)];
const rgb=a=>'rgb('+(a[0]|0)+','+(a[1]|0)+','+(a[2]|0)+')';
const say=s=>{msg=s;msgT=150};

/* ---------- paleta propia ---------- */
const P={
 bark:[101,64,42],barkL:[168,117,67],barkD:[70,44,30],cut:[214,170,112],
 leafD:[36,91,54],leafM:[52,123,62],leaf2:[66,138,66],leafL:[87,153,75],leafH:[124,184,92],
 rockD:[48,56,60],rock:[96,106,112],rockL:[138,148,152],rockH:[186,196,194],moss:[74,120,70],crack:[26,32,36],
 stem:[57,115,68],stemL:[79,154,83],center:[250,230,140],
 deer:[155,118,82],deerL:[196,155,112],deerD:[118,86,58],white:[232,226,210],antler:[216,196,150],
 rab:[190,175,155],rabL:[226,214,194],rabD:[150,132,112],
 bushD:[40,96,56],bush:[58,124,70],bushL:[92,160,86],berry:[200,48,60],
 capR:[196,64,64],stemW:[230,224,204],
 grass1:[74,132,70],grass2:[100,164,84],pebble:[130,138,140],dust:[190,170,130],dust2:[205,190,156],
 apple:[200,60,70],eye:[20,16,12]
};
const FLOWERS=[[238,201,72],[226,110,150],[110,150,236],[240,240,232]];
const CROPC=[236,150,60];
const BFLY=[[236,150,60],[110,160,230],[232,130,176],[240,240,225]];
const TREE_LEAF=[P.leafD,P.leafM,P.leafL,P.leafH,P.leaf2];
const TREE_WOOD=[P.bark,P.barkL,P.barkD];
const STONE_P=[P.rock,P.rockL,P.rockD,P.rockH];
const DUST=[P.dust,P.dust2];

/* ---------- ruido y hash ---------- */
function hash2(ix,iy){
 let h=Math.imul(ix,73856093)^Math.imul(iy,19349663);
 h=Math.imul(h^(h>>>13),1274126177);
 return((h^(h>>>16))&1023)/1023;
}
function vnoise(x,y){
 const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
 const a=hash2(ix,iy),b=hash2(ix+1,iy),cc=hash2(ix,iy+1),d=hash2(ix+1,iy+1);
 const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
 return a+(b-a)*sx+(cc-a)*sy+(a-b-cc+d)*sx*sy;
}

/* ---------- tablas precalculadas ---------- */
const zbuf=new Float32Array(W).fill(30);
const OC=new Float32Array(W),OS=new Float32Array(W);
for(let x=0;x<W;x++){const o=((x+.5)/W-.5)*FOV;OC[x]=Math.cos(o);OS[x]=Math.sin(o)}
const FW=320,FH=90;
const FC=new Float32Array(FW),FS=new Float32Array(FW),FI=new Float32Array(FW);
const CDX=new Float32Array(FW),CDY=new Float32Array(FW);
for(let i=0;i<FW;i++){const o=((2*i+1)/W-.5)*FOV;FC[i]=Math.cos(o);FS[i]=Math.sin(o);FI[i]=1/FC[i]}
const fcan=document.createElement('canvas');
fcan.width=FW;fcan.height=FH;
const fg=fcan.getContext('2d');
const fimg=fg.createImageData(FW,FH),fd=fimg.data;

/* ---------- cielo: elementos fijos en azimut ---------- */
const clouds=Array.from({length:9},()=>({az:Math.random()*6.283,y:26+Math.random()*70,w:30+Math.random()*40}));
const birds=Array.from({length:5},()=>({az:Math.random()*6.283,y:40+Math.random()*55,ph:Math.random()*6,sp:.0015+Math.random()*.003}));
const stars=Array.from({length:70},()=>({az:Math.random()*6.283,y:5+Math.random()*115,tw:Math.random()*6}));
const PINES=Array.from({length:64},(_,i)=>i/64*Math.PI*2+Math.sin(i*12.9898)*.04);

/* ---------- audio ---------- */
let AC=null,NB=null;
function audio(){
 if(!snd)return null;
 try{
  if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(A)AC=new A()}
  if(AC&&AC.state==='suspended')AC.resume();
 }catch(e){}
 return AC;
}
function tone(f,d,type,vol,slide){
 const a=audio();if(!a)return;
 try{
  const o=a.createOscillator(),v=a.createGain(),t=a.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);
  v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(v);v.connect(a.destination);o.start();o.stop(t+d+.02);
 }catch(e){}
}
function noise(d,vol,fq){
 const a=audio();if(!a)return;
 try{
  if(!NB){
   NB=a.createBuffer(1,(a.sampleRate*.7)|0,a.sampleRate);
   const ch=NB.getChannelData(0);
   for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;
  }
  const s=a.createBufferSource(),fl=a.createBiquadFilter(),v=a.createGain(),t=a.currentTime;
  s.buffer=NB;fl.type='lowpass';fl.frequency.value=fq;
  v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(fl);fl.connect(v);v.connect(a.destination);s.start();s.stop(t+d);
 }catch(e){}
}
function sfx(k){
 if(k==='wood'){tone(140,.12,'triangle',.12,.6);noise(.08,.1,1800)}
 else if(k==='stone'){tone(720,.08,'square',.04,.5);noise(.1,.12,3500)}
 else if(k==='fall'){noise(.55,.18,600);tone(180,.5,'sawtooth',.03,.4)}
 else if(k==='thud'){tone(70,.35,'sine',.28,.5);noise(.3,.2,300)}
 else if(k==='break'){noise(.5,.25,2600);tone(220,.22,'sawtooth',.05,.4)}
 else if(k==='pick'){tone(900,.09,'sine',.06,1.6)}
 else if(k==='chof'){tone(95,.15,'sine',.12)}
 else if(k==='tink'){tone(1100,.07,'square',.03,.6)}
 else if(k==='whiff'){noise(.08,.05,2000)}
}

/* ---------- partículas 3D (trozos y píxeles) ---------- */
function addP(x,y,z,vx,vy,vz,s,col,lvl){
 if(parts.length>1800)return;
 parts.push({x,y,z,vx,vy,vz,s,col,lvl,st:0,t:0,a:1,b:0});
}
const jit=cl=>[clamp(cl[0]+(Math.random()-.5)*22,0,255),clamp(cl[1]+(Math.random()-.5)*22,0,255),clamp(cl[2]+(Math.random()-.5)*22,0,255)];
const wallAt=(x,y)=>map[Math.floor(y)]?.[Math.floor(x)]!==0;

function updateParts(){
 for(let i=parts.length-1;i>=0;i--){
  const p=parts[i];
  if(p.st===0){
   p.vz-=.006;
   const nx=p.x+p.vx,ny=p.y+p.vy;
   if(wallAt(nx,p.y))p.vx*=-.3;else p.x=nx;
   if(wallAt(p.x,ny))p.vy*=-.3;else p.y=ny;
   p.z+=p.vz;
   if(p.z<=0){
    p.z=0;p.vz=-p.vz*.35;p.vx*=.55;p.vy*=.55;p.b++;
    if(p.b>=2||p.vz<.012){
     p.st=1;p.vz=0;p.vx=0;p.vy=0;
     p.t=p.lvl===0?30+Math.random()*50:p.lvl===1?20+Math.random()*30:10+Math.random()*25;
    }
   }
  }else if(p.st===1){
   if(--p.t<=0){
    if(p.lvl<2){
     const h=p.s/2;
     for(let k=0;k<4;k++)
      addP(p.x+((k&1)?h/2:-h/2),p.y+((k&2)?h/2:-h/2),p.z,
       (Math.random()-.5)*.012,(Math.random()-.5)*.012,.015+Math.random()*.025,
       h,jit(p.col),p.lvl+1);
     parts.splice(i,1);
    }else p.st=2;
   }
  }else{
   p.z+=.003;p.a-=.04;
   if(p.a<=0)parts.splice(i,1);
  }
 }
}

/* ---------- mundo ---------- */
function fresh(){
 seed=(Date.now()>>>0);
 map=Array.from({length:mapH},()=>Array(mapW).fill(0));
 wood=stone=food=0;seeds=5;hp=5;tool=1;frame=0;msg='';msgT=0;
 camShake=0;cool=0;toolSwing=0;hitTextT=0;
 dayStarted=performance.now()-DAY_LENGTH*.06;
 for(let y=0;y<mapH;y++)for(let x=0;x<mapW;x++)
  if(x===0||y===0||x===mapW-1||y===mapH-1)map[y][x]=1;
 player={x:32.5,y:32.5,a:0};
 buildWorld();
 updateToolButtons();
}

function buildWorld(){
 objects=[];deco=[];insects=[];parts.length=0;blocked.clear();
 for(let y=2;y<mapH-2;y++)for(let x=2;x<mapW-2;x++)
  if((x<8||x>56||y<8||y>56)&&rnd()<.025)map[y][x]=1;

 const occ=new Set();
 function freeCell(){
  for(let t=0;t<40;t++){
   const x=3+Math.floor(rnd()*(mapW-6)),y=3+Math.floor(rnd()*(mapH-6));
   if(map[y][x]!==0||occ.has(y*mapW+x)||Math.hypot(x+.5-32.5,y+.5-32.5)<4)continue;
   return [x,y];
  }
  return null;
 }
 function place(type,kind,extra){
  const cell=freeCell();if(!cell)return;
  const x=cell[0],y=cell[1];
  occ.add(y*mapW+x);
  const o=Object.assign({
   x:x+.5,y:y+.5,cellX:x,cellY:y,type,kind,hp:3,
   phase:rnd()*6,dir:rnd()*6.283,turn:40+Math.floor(rnd()*150),
   shake:0,sc:1,face:1,state:'',v:rnd(),idle:0,mv:false,age:0
  },extra||{});
  objects.push(o);
  if(type==='tree'||type==='rock')blocked.add(y*mapW+x);
 }
 for(let i=0;i<58;i++)place('tree','oak',{sc:.85+rnd()*.4});
 for(let i=0;i<34;i++)place('rock','stone',{sc:.75+rnd()*.55});
 for(let i=0;i<40;i++)place('plant','flower',{col:Math.floor(rnd()*4),hp:1});
 for(let i=0;i<20;i++)place('animal',rnd()<.5?'deer':'rabbit',{hp:1});
 for(let i=0;i<20;i++)place('bush','bush',{berries:rnd()<.7,regrow:0,hp:1});
 for(let i=0;i<16;i++)place('shroom','shroom',{hp:1});

 for(let i=0;i<340;i++){
  const x=2+rnd()*(mapW-4),y=2+rnd()*(mapH-4);
  if(map[Math.floor(y)][Math.floor(x)]!==0)continue;
  const r=rnd();
  deco.push({x,y,type:r<.75?'tuft':r<.92?'pebble':'clover',phase:rnd()*6,sc:.8+rnd()*.5,shake:0,state:''});
 }
 for(const o of objects)
  if(o.kind==='flower'&&rnd()<.4)
   insects.push({hx:o.x,hy:o.y,phase:rnd()*6,speed:.01+rnd()*.012,r:.35,col:Math.floor(rnd()*4),fire:false,x:o.x,y:o.y});
 for(let i=0;i<30;i++)
  insects.push({hx:32+rnd()*6,hy:32+rnd()*6,phase:rnd()*6,speed:.006+rnd()*.01,r:.7,col:0,fire:true,x:32,y:32});

 say('Árboles y rocas: 3 golpes. E recoge flores, bayas y setas.');
}

/* ---------- colisiones ---------- */
function solid(x,y){
 const cx=Math.floor(x),cy=Math.floor(y);
 if(cx<0||cy<0||cx>=mapW||cy>=mapH)return true;
 return map[cy][cx]!==0||blocked.has(cy*mapW+cx);
}
const solidR=(x,y,r)=>solid(x-r,y-r)||solid(x+r,y-r)||solid(x-r,y+r)||solid(x+r,y+r);
function move(dx,dy){
 const nx=player.x+dx,ny=player.y+dy;
 if(!solidR(nx,player.y,.22))player.x=nx;
 if(!solidR(player.x,ny,.22))player.y=ny;
}

/* ---------- raycasting de paredes (DDA) ---------- */
const RC={dist:0,hit:0,side:0,tx:0};
function castDir(dx,dy){
 let mx=Math.floor(player.x),my=Math.floor(player.y);
 const ddx=Math.abs(1/(dx||1e-9)),ddy=Math.abs(1/(dy||1e-9));
 let stx,sty,sdx,sdy;
 if(dx<0){stx=-1;sdx=(player.x-mx)*ddx}else{stx=1;sdx=(mx+1-player.x)*ddx}
 if(dy<0){sty=-1;sdy=(player.y-my)*ddy}else{sty=1;sdy=(my+1-player.y)*ddy}
 let side=0,hit=0,n=0;
 while(n++<90){
  if(sdx<sdy){sdx+=ddx;mx+=stx;side=0}else{sdy+=ddy;my+=sty;side=1}
  const v=map[my]?.[mx];
  if(v===undefined){hit=1;break}
  if(v){hit=v;break}
 }
 const dist=side===0?sdx-ddx:sdy-ddy;
 let t=side===0?player.y+dist*dy:player.x+dist*dx;
 t-=Math.floor(t);
 RC.dist=dist;RC.hit=hit;RC.side=side;RC.tx=t;
 return RC;
}

/* =========================================================
   RENDER
   ========================================================= */
function px(x,y,w,h,col){
 g.fillStyle=col;
 g.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));
}
function tint(p,f){
 return 'rgb('+((p[0]*f+FOG[0]*(1-f))|0)+','+((p[1]*f+FOG[1]*(1-f))|0)+','+((p[2]*f+FOG[2]*(1-f))|0)+')';
}

/* Dibujo en unidades de mundo ANCLADO AL SUELO:
   RX = x en pantalla del centro, RY = y del suelo en ese punto,
   RU = píxeles por unidad de mundo (1 unidad = altura de pared). */
let RX=0,RY=0,RU=1,RF=1,RFLIP=1,RZ=0;
function R(lx,ly,lw,lh,p){
 if(RFLIP<0)lx=-lx-lw;
 const x=Math.round(RX+lx*RU),y=Math.round(RY-(ly+RZ+lh)*RU);
 const w=Math.max(1,Math.round(RX+(lx+lw)*RU)-x),h=Math.max(1,Math.round(RY-(ly+RZ)*RU)-y);
 g.fillStyle=tint(p,RF);
 g.fillRect(x,y,w,h);
}

/* ---- sprites ---- */
function drawTree(o){
 const dmg=3-o.hp;
 R(-.17,0,.34,.09,P.barkD);
 R(-.10,.05,.20,.9,P.bark);
 R(-.06,.08,.05,.8,P.barkL);
 R(.04,.1,.04,.7,P.barkD);
 if(dmg>=1){R(-.10,.34,.13,.08,P.cut);R(-.10,.32,.13,.03,P.barkD)}
 if(dmg>=2){R(-.02,.5,.12,.09,P.cut);R(-.02,.48,.12,.03,P.barkD);R(-.10,.34,.2,.1,P.cut)}
 R(-.52,.78,1.04,.42,P.leafD);
 R(-.44,1.0,.88,.40,P.leafM);
 R(-.30,1.26,.60,.30,P.leaf2);
 R(-.16,1.46,.32,.16,P.leafL);
 R(-.38,1.12,.2,.1,P.leafL);R(.1,.92,.22,.1,P.leafL);
 R(-.1,1.34,.16,.08,P.leafH);R(.18,1.18,.14,.08,P.leafH);
 R(-.46,.86,.14,.1,P.leafM);R(.3,.84,.16,.08,P.leafM);
 if(o.v>.6){R(-.2,.95,.07,.07,P.apple);R(.22,1.1,.07,.07,P.apple)}
}
function drawRock(o){
 const dmg=3-o.hp;
 R(-.42,0,.84,.10,P.rockD);
 R(-.38,.07,.76,.2,P.rock);
 R(-.30,.25,.60,.17,P.rockL);
 R(-.14,.40,.30,.08,P.rockH);
 R(-.34,.2,.12,.08,P.rockL);
 R(.22,.1,.1,.1,P.rockD);

/* ---- oclusión por columnas (paredes tapan sprites) ---- */
const RUNS=[];
function occlusion(x0,x1,perp){
 x0=Math.max(0,Math.floor(x0));x1=Math.min(W-1,Math.ceil(x1));
 RUNS.length=0;
 let start=-1,any=false,all=true;
 for(let x=x0;x<=x1;x++){
  if(zbuf[x]>perp-.12){any=true;if(start<0)start=x}
  else{all=false;if(start>=0){RUNS.push(start,x-start);start=-1}}
 }
 if(start>=0)RUNS.push(start,x1-start+1);
 return !any?0:(all?1:2);
}

const HW={tree:.62,rock:.48,plant:.22,animal:.5,bush:.4,shroom:.15,tuft:.15,pebble:.1,clover:.12};
const SW={tree:.9,rock:.85,plant:.3,animal:.6,bush:.7,shroom:.2,pebble:.15};

function drawObj(o,it){
 const perp=it.perp,u=H/perp,sx=(.5+it.a/FOV)*W,gy=HH+u/2,sc=o.sc||1;
 const falling=o.state==='falling';
 const hw=(falling?2.1:(HW[o.type]||.3))*sc;
 if(sx+hw*u<0||sx-hw*u>W)return;
 const f=clamp(1-(perp-2.5)/15,.25,1);
 const occ=occlusion(sx-hw*u,sx+hw*u,perp);
 if(occ===0)return;
 let clipped=false;
 if(occ===2){
  g.save();g.beginPath();
  for(let i=0;i<RUNS.length;i+=2)g.rect(RUNS[i],0,RUNS[i+1],H);
  g.clip();clipped=true;
 }
 const sw=SW[o.type]||0;
 if(sw){
  const w=sw*sc*u;
  g.fillStyle='rgba(0,0,0,'+(.3*f)+')';
  g.fillRect(Math.round(sx-w/2),Math.round(gy-Math.max(1,w*.11)),Math.round(w),Math.max(2,Math.round(w*.22)));
 }
 RX=sx+(o.shake>0?Math.sin(o.shake*1.7)*o.shake*.5:0);
 RY=gy;RU=u*sc;RF=f;RFLIP=1;RZ=0;
 if(o.type==='animal'){
  const lat=Math.cos(o.dir)*-SP+Math.sin(o.dir)*CP;
  if(Math.abs(lat)>.2)o.face=lat>0?1:-1;
  RFLIP=o.face;
 }
 if(falling){
  const t=Math.min(1,o.fallT/FALL_FR),ang=Math.pow(t,2.2)*Math.PI/2*.97;
  g.save();g.translate(RX,RY);g.rotate(ang*o.fallDir);
  RX=0;RY=0;drawTree(o);
  g.restore();
 }else switch(o.type){
  case 'tree':drawTree(o);break;
  case 'rock':drawRock(o);break;
  case 'plant':drawPlant(o);break;
  case 'bush':drawBush(o);break;
  case 'shroom':drawShroom();break;
  case 'animal':drawAnimal(o);break;
  case 'tuft':drawTuft(o);break;
  case 'pebble':drawPebble();break;
  case 'clover':drawClover();break;
 }
 if(clipped)g.restore();
}

function drawPart(it){

 const size=Math.max(1,Math.round(p.s*u)),x=Math.round(sx-size/2);
 if(x+size<0||x>W)return;
 if(zbuf[clamp(Math.round(sx),0,W-1)]<perp-.1)return;
 const f=clamp(1-(perp-2.5)/15,.25,1),y=Math.round(gy-(p.z+p.s)*u);
 if(p.st!==2){
  g.fillStyle='rgba(0,0,0,.22)';

 }

 g.fillStyle=tint(p.col,f);
 g.fillRect(x,y,size,size);
 if(size>=4){

  g.fillStyle='rgba(255,255,255,.18)';g.fillRect(x,y,size,q);
  g.fillStyle='rgba(0,0,0,.2)';g.fillRect(x,y+size-q,size,q);

 if(p.a<1)g.globalAlpha=1;
}

/* ---- suelo con perspectiva real (floor casting) ---- */
function drawFloor(){
 for(let i=0;i<FW;i++){
  CDX[i]=CP*FC[i]-SP*FS[i];
  CDY[i]=SP*FC[i]+CP*FS[i];
 }
 const px0=player.x,py0=player.y;
 let idx=0;
 for(let j=0;j<FH;j++){
  const dp=HH/(2*j+1);
  const m=Math.min(.9,Math.max(0,(dp-2.5)/17));
  const detail=dp<7;
  for(let i=0;i<FW;i++){
   const dist=dp*FI[i],wx=px0+CDX[i]*dist,wy=py0+CDY[i]*dist;
   const n=vnoise(wx*.45,wy*.45);
   let r=54+42*n,gg=96+50*n,b=60+20*n;
   if(n>.78){
    const k=Math.min(1,(n-.78)*5);
    r+=(126-r)*k;gg+=(104-gg)*k;b+=(70-b)*k;
   }
   if(detail){
    const t=hash2(Math.floor(wx*6),Math.floor(wy*6));
    if(t>.9){r+=22;gg+=24;b+=10}else if(t<.1){r-=16;gg-=18;b-=12}
   }
   fd[idx++]=r+(FOG[0]-r)*m;
   fd[idx++]=gg+(FOG[1]-gg)*m;
   fd[idx++]=b+(FOG[2]-b)*m;
   fd[idx++]=255;
  }
 }
 fg.putImageData(fimg,0,0);
 g.drawImage(fcan,0,HH,W,HH);
}

/* ---- paredes ---- */
function drawWalls(){
 for(let x=0;x<W;x++){
  const co=OC[x],si=OS[x];
  const hit=castDir(CP*co-SP*si,SP*co+CP*si);
  const d=Math.max(.05,hit.dist*co);
  zbuf[x]=d;
  const h=Math.min(H*1.6,H/d),top=(H-h)/2;
  const shade=Math.max(.3,1-d/17)*(hit.side?.78:1),m=clamp(d/20,0,.7);
  const rr=(75*shade)*(1-m)+FOG[0]*m,gg=(91*shade)*(1-m)+FOG[1]*m,bb=(111*shade)*(1-m)+FOG[2]*m;
  g.fillStyle='rgb('+(rr|0)+','+(gg|0)+','+(bb|0)+')';
  g.fillRect(x,top,1,h);
  if(h>14){
   const tx=hit.tx;
   g.fillStyle='rgba(10,16,24,.35)';
   for(let q=1;q<4;q++)g.fillRect(x,top+h*q/4,1,1);
   for(let q=0;q<4;q++){
    const t=(tx*3+(q&1)*.5)%1;
    if(t<.07)g.fillRect(x,top+h*q/4,1,h/4);
   }
   g.fillStyle='rgba(74,130,76,.5)';
   g.fillRect(x,top,1,Math.max(1,h*.07*(1+Math.sin(tx*20)*.6)));
  }
 }
}

 g.fillStyle='#fff';g.font='10px monospace';
 g.fillText('MADERA '+wood+'  ROCA '+stone+'  COMIDA '+food,15,40);
 g.fillStyle='rgba(2,7,14,.8)';g.fillRect(495,7,138,30);
 g.fillStyle='#bde5ff';g.textAlign='center';g.font='bold 11px monospace';
 g.fillText(['','HACHA','PICO','SEMILLAS '+seeds,'CUCHILLO'][tool],564,26);
 if(msgT>0){
  g.fillStyle='rgba(2,7,14,.85)';g.fillRect(90,56,460,22);
  g.fillStyle='#fff';g.font='11px monospace';g.fillText(msg,320,71);
  msgT--;
 }
 g.textAlign='left';
}

function drawMini(){
 const mx=560,my=44,s=72,Rr=14,k=s/(Rr*2);
 g.fillStyle='rgba(2,7,14,.72)';g.fillRect(mx,my,s,s);
 g.strokeStyle='rgba(180,210,230,.6)';g.strokeRect(mx+.5,my+.5,s-1,s-1);
 const dot=(x,y,col,sz)=>{
  const qx=mx+s/2+(x-player.x)*k,qy=my+s/2+(y-player.y)*k;
  if(qx<mx+1||qy<my+1||qx>mx+s-2||qy>my+s-2)return;
  g.fillStyle=col;g.fillRect(qx-sz/2,qy-sz/2,sz,sz);
 };
 for(const o of objects){
  if(o.type==='tree')dot(o.x,o.y,'#3f9a4a',2);
  else if(o.type==='rock')dot(o.x,o.y,'#aab4ba',2);
  else if(o.type==='animal')dot(o.x,o.y,'#e0a060',3);
 }
 g.fillStyle='#fff';g.fillRect(mx+s/2-1.5,my+s/2-1.5,3,3);
 g.strokeStyle='#fff';g.beginPath();g.moveTo(mx+s/2,my+s/2);
 g.lineTo(mx+s/2+CP*9,my+s/2+SP*9);g.stroke();
}

/* =========================================================
   JUEGO: objetivos, golpes, caída y fragmentación
   ========================================================= */
function targetObject(range){
 let best=null,bd=range;
 for(const o of objects){
  if(o.state)continue;
  const dx=o.x-player.x,dy=o.y-player.y,perp=dx*Math.cos(player.a)+dy*Math.sin(player.a);
  if(perp<.1||perp>bd)continue;
  const lat=-dx*Math.sin(player.a)+dy*Math.cos(player.a);
  if(Math.abs(lat)<(o.type==='tree'||o.type==='rock'?.55:.4)){best=o;bd=perp}
 }
 return best;
}

function puff(x,y,pal,n,lvl,zmax){
 for(let i=0;i<n;i++)
  addP(x+(Math.random()-.5)*.35,y+(Math.random()-.5)*.35,.05+Math.random()*zmax,
   (Math.random()-.5)*.04,(Math.random()-.5)*.04,.03+Math.random()*.06,
   lvl===0?.1+Math.random()*.04:lvl===1?.06+Math.random()*.03:.04+Math.random()*.02,
   jit(pick(pal)),lvl);
}

function hitObj(o){
 o.hp--;o.shake=14;camShake=Math.max(camShake,2);
 const tree=o.type==='tree';
 const bx=o.x+(player.x-o.x)*.35,by=o.y+(player.y-o.y)*.35;
 for(let i=0;i<8;i++)
  addP(bx+(Math.random()-.5)*.4,by+(Math.random()-.5)*.4,.3+Math.random()*.4,
   (Math.random()-.5)*.04,(Math.random()-.5)*.04,.02+Math.random()*.05,.04+Math.random()*.03,
   pick(tree?(i<4?TREE_WOOD:TREE_LEAF):STONE_P),2);
 if(o.hp>0){
  hitText=(tree?'TOC! ':'TICK! ')+(3-o.hp)+'/3';hitTextT=34;
  sfx(tree?'wood':'stone');
  return;
 }
 if(tree){
  startFall(o);wood+=3;say('Madera +3');
  hitText='¡CRAAAC!';hitTextT=50;
 }else{
  breakRock(o);stone+=2;say('Piedra +2');
  hitText='¡CRASH!';hitTextT=50;
 }
}

function startFall(o){
 blocked.delete(o.cellY*mapW+o.cellX);
 o.state='falling';o.fallT=0;o.shake=0;
 o.fallDir=Math.random()<.5?-1:1;
 o.fv=[-Math.sin(player.a),Math.cos(player.a)];
 sfx('fall');
}

function landTree(o){
 const sc=o.sc,fx=o.fv[0]*o.fallDir,fy=o.fv[1]*o.fallDir,dx=Math.cos(player.a),dy=Math.sin(player.a);
 for(let i=0;i<10;i++){
  const t=Math.random()*.9*sc;
  addP(o.x+fx*t+(Math.random()-.5)*.12,o.y+fy*t+(Math.random()-.5)*.12,.05+Math.random()*.1,
   fx*(.005+Math.random()*.02)+(Math.random()-.5)*.02,fy*(.005+Math.random()*.02)+(Math.random()-.5)*.02,
   .03+Math.random()*.06,.1+Math.random()*.04,pick(TREE_WOOD),0);
 }
 for(let i=0;i<26;i++){
  const t=(.8+Math.random()*.9)*sc,w=(Math.random()-.5)*.7;
  addP(o.x+fx*t+dx*w,o.y+fy*t+dy*w,.08+Math.random()*.25,
   fx*(.005+Math.random()*.02)+(Math.random()-.5)*.02,fy*(.005+Math.random()*.02)+(Math.random()-.5)*.02,
   .03+Math.random()*.07,.09+Math.random()*.05,pick(TREE_LEAF),0);
 }
 puff(o.x+fx*.5,o.y+fy*.5,DUST,12,2,.2);
 camShake=7;sfx('thud');
}

function breakRock(o){
 blocked.delete(o.cellY*mapW+o.cellX);
 const i=objects.indexOf(o);if(i>=0)objects.splice(i,1);
 const rx=-Math.sin(player.a),ry=Math.cos(player.a),dx=Math.cos(player.a),dy=Math.sin(player.a);
 for(let k=0;k<14;k++){
  const w=(Math.random()-.5)*.7*o.sc,dd=(Math.random()-.5)*.4;
  const vx=rx*w+dx*dd,vy=ry*w+dy*dd;
  addP(o.x+vx,o.y+vy,.06+Math.random()*.35,vx*.07+(Math.random()-.5)*.02,vy*.07+(Math.random()-.5)*.02,
   .04+Math.random()*.08,.09+Math.random()*.05,pick(STONE_P),0);
 }
 puff(o.x,o.y,DUST,12,2,.3);
 camShake=8;sfx('break');
}

function killAnimal(o){
 const i=objects.indexOf(o);if(i>=0)objects.splice(i,1);
 const pal=o.kind==='rabbit'?[P.rab,P.rabL,P.rabD]:[P.deer,P.deerL,P.deerD];
 puff(o.x,o.y,pal,16,1,.5);
 const gain=o.kind==='deer'?2:1;
 food+=gain;say('Carne +'+gain);
 hitText='CHOF!';hitTextT=30;sfx('chof');
}

function attack(){
 if(cool>0)return;
 cool=15;toolSwing=14;
 const o=targetObject(2.4);
 if(!o){say('No hay nada delante.');sfx('whiff');return}
 if(o.type==='animal'){
  if(tool===4)killAnimal(o);else{say('Necesitas el cuchillo (4).');sfx('tink')}
  return;
 }
 if(o.type==='tree'){
  if(tool===1)hitObj(o);else{say('Necesitas el hacha (1).');sfx('tink')}
  return;
 }
 if(o.type==='rock'){
  if(tool===2)hitObj(o);else{say('Necesitas el pico (2).');sfx('tink')}
  return;
 }
 say('Pulsa E para recoger.');
}

function interact(){
 const o=targetObject(2.4);
 if(o){
  if(o.type==='animal'){say('Selecciona el cuchillo (4) y pulsa ATACAR.');return}
  if(o.type==='tree'){say('Usa el hacha (1) y pulsa ATACAR: 3 golpes.');return}
  if(o.type==='rock'){say('Usa el pico (2) y pulsa ATACAR: 3 golpes.');return}
  if(o.type==='plant'){
   if(o.kind==='crop'){
    if(o.age<GROW){say('Aún está creciendo...');return}
    food+=2;seeds++;say('Cosecha +2 y una semilla.');
   }else{food++;say('Has recogido una flor.')}
   puff(o.x,o.y,o.kind==='crop'?[CROPC,P.stemL]:[FLOWERS[o.col|0],P.stemL],8,2,.3);
   objects.splice(objects.indexOf(o),1);sfx('pick');return;
  }
  if(o.type==='bush'){
   if(o.berries){
    o.berries=false;o.regrow=900;food++;say('Bayas +1');
    puff(o.x,o.y,[P.berry,P.bushL],8,2,.3);sfx('pick');
   }else say('Aún no tiene bayas.');
   return;
  }
  if(o.type==='shroom'){
   food++;say('Seta +1');
   puff(o.x,o.y,[P.capR,P.stemW],8,2,.2);
   objects.splice(objects.indexOf(o),1);sfx('pick');return;
  }
 }
 if(tool===3){
  if(seeds>0){
   const x=Math.floor(player.x+Math.cos(player.a)*1.5),y=Math.floor(player.y+Math.sin(player.a)*1.5);
   if(map[y]?.[x]===0&&!blocked.has(y*mapW+x)&&!objects.some(q=>q.cellX===x&&q.cellY===y)){
    objects.push({x:x+.5,y:y+.5,cellX:x,cellY:y,type:'plant',kind:'crop',hp:1,phase:Math.random()*6,age:0,shake:0,sc:1,state:'',v:.5});
    seeds--;say('Semilla plantada.');sfx('pick');
   }else say('Esa celda no está libre.');
  }else say('No quedan semillas.');
  return;
 }
 say('Acércate a un elemento.');
}

/* =========================================================
   CONTROLES
   ========================================================= */
const joystick=document.getElementById('joystick'),stick=document.getElementById('stick');
let joy={x:0,y:0},joyPointer=null;
function joystickMove(e){
 const r=joystick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
 const max=r.width*.34,len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 joy.x=dx/max;joy.y=dy/max;
 stick.style.transform='translate('+dx+'px,'+dy+'px)';
}
joystick.addEventListener('pointerdown',e=>{joyPointer=e.pointerId;joystick.setPointerCapture(e.pointerId);joystickMove(e)});
joystick.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)joystickMove(e)});
function stopJoy(){joyPointer=null;joy.x=0;joy.y=0;stick.style.transform='translate(0,0)'}
joystick.addEventListener('pointerup',stopJoy);
joystick.addEventListener('pointercancel',stopJoy);

const look=document.getElementById('look');
let lookPointer=null,lastX=0;
look.addEventListener('pointerdown',e=>{lookPointer=e.pointerId;lastX=e.clientX;look.setPointerCapture(e.pointerId)});
look.addEventListener('pointermove',e=>{
 if(e.pointerId!==lookPointer)return;
 player.a+=(e.clientX-lastX)*.009;lastX=e.clientX;
});
const stopLook=()=>{lookPointer=null};
look.addEventListener('pointerup',stopLook);
look.addEventListener('pointercancel',stopLook);

function buttonHold(id,down,up){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{e.preventDefault();down();el.classList.add('active')});
 const off=()=>{el.classList.remove('active');if(up)up()};
 el.addEventListener('pointerup',off);
 el.addEventListener('pointercancel',off);
 el.addEventListener('pointerleave',off);
}
buttonHold('attack',()=>{atkHeld=true;attack()},()=>{atkHeld=false});
buttonHold('interact',interact);

document.getElementById('newworld').addEventListener('click',fresh);
document.getElementById('sndbtn').addEventListener('click',e=>{
 snd=!snd;e.target.textContent=snd?'SONIDO':'SILENCIO';
});
document.getElementById('fsbtn').addEventListener('click',()=>{
 try{
  const d=document.documentElement;
  if(document.fullscreenElement||document.webkitFullscreenElement){
   (document.exitFullscreen||document.webkitExitFullscreen).call(document);
  }else(d.requestFullscreen||d.webkitRequestFullscreen).call(d);
 }catch(e){}
});
window.addEventListener('pointerdown',()=>{audio();try{window.focus()}catch(e){}},true);
window.addEventListener('contextmenu',e=>e.preventDefault());

function updateToolButtons(){
 document.querySelectorAll('.tool').forEach(b=>{
  b.classList.toggle('selected',Number(b.dataset.tool)===tool);
 });
}
document.querySelectorAll('.tool').forEach(b=>{
 b.addEventListener('click',()=>{tool=Number(b.dataset.tool);updateToolButtons()});
});

window.addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 keys[k]=true;
 if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k))e.preventDefault();
 if(k==='1')tool=1;
 if(k==='2')tool=2;
 if(k==='3')tool=3;
 if(k==='4')tool=4;
 if(k==='e'&&!e.repeat)interact();
 if(k==='r'&&!e.repeat)fresh();
 updateToolButtons();
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});

/* =========================================================
   ACTUALIZACIÓN (paso fijo 60 Hz)
   ========================================================= */
function updateAnimals(){
 for(const a of objects){
  if(a.type!=='animal')continue;
  const dx=a.x-player.x,dy=a.y-player.y,d=Math.hypot(dx,dy);
  let sp=a.kind==='rabbit'?.016:.011;
  a.mv=false;
  if(d<3.2){
   a.dir=Math.atan2(dy,dx)+Math.sin(a.phase)*.4;sp*=3.2;a.turn=30;a.idle=0;
  }else{
   if(a.idle>0){a.idle--;continue}
   if(--a.turn<=0){
    a.dir+=(Math.random()-.5)*2.8;a.turn=45+Math.floor(Math.random()*180);
    if(Math.random()<.4)a.idle=40+Math.floor(Math.random()*80);
   }
  }
  const nx=a.x+Math.cos(a.dir)*sp,ny=a.y+Math.sin(a.dir)*sp;
  if(!solid(nx,ny)){a.x=nx;a.y=ny;a.phase+=sp*14;a.mv=true}
  else a.dir+=Math.PI*(.5+Math.random());
 }
}

function updateObjects(){
 for(let i=objects.length-1;i>=0;i--){
  const o=objects[i];
  if(o.shake>0)o.shake--;
  if(o.state==='falling'){
   o.fallT++;
   const t=Math.min(1,o.fallT/FALL_FR),ang=Math.pow(t,2.2)*Math.PI/2;
   if(o.fallT%3===0){
    const L=1.15*o.sc,s=Math.sin(ang)*L*o.fallDir;
    addP(o.x+o.fv[0]*s+(Math.random()-.5)*.6,o.y+o.fv[1]*s+(Math.random()-.5)*.6,
     Math.cos(ang)*L+.1,(Math.random()-.5)*.01,(Math.random()-.5)*.01,0,.06,pick(TREE_LEAF),2);
   }
   if(t>=1){landTree(o);objects.splice(i,1)}
   continue;
  }
  if(o.kind==='crop'&&o.age<GROW)o.age++;
  if(o.type==='bush'&&!o.berries&&--o.regrow<=0)o.berries=true;
 }
}

function updateInsects(){
 for(const b of insects){
  b.phase+=b.speed;
  if(b.fire){
   if(Math.hypot(b.hx-player.x,b.hy-player.y)>12){
    const a=Math.random()*6.283,r=3+Math.random()*8;
    b.hx=player.x+Math.cos(a)*r;b.hy=player.y+Math.sin(a)*r;
   }
  }
  b.x=b.hx+Math.sin(b.phase*2)*b.r;
  b.y=b.hy+Math.cos(b.phase*1.4)*b.r*.8;
 }
}

function update(){
 frame++;
 if(cool>0)cool--;
 if(camShake>0)camShake--;
 if(toolSwing>0)toolSwing--;
 let mv=false;

 if(keys.arrowleft)player.a-=.045;
 if(keys.arrowright)player.a+=.045;
 const ca=Math.cos(player.a),sa=Math.sin(player.a);
 if(keys.w||keys.arrowup){move(ca*.075,sa*.075);mv=true}
 if(keys.s||keys.arrowdown){move(-ca*.065,-sa*.065);mv=true}
 if(keys.a){move(Math.cos(player.a-Math.PI/2)*.06,Math.sin(player.a-Math.PI/2)*.06);mv=true}
 if(keys.d){move(Math.cos(player.a+Math.PI/2)*.06,Math.sin(player.a+Math.PI/2)*.06);mv=true}
 if(Math.abs(joy.y)>.08){move(ca*(-joy.y)*.075,sa*(-joy.y)*.075);mv=true}
 if(Math.abs(joy.x)>.08){move(Math.cos(player.a+Math.PI/2)*joy.x*.065,Math.sin(player.a+Math.PI/2)*joy.x*.065);mv=true}
 moving=mv;

 if(keys[' ']||atkHeld)attack();

 updateAnimals();
 updateObjects();
 updateInsects();
 updateParts();
 for(const cl of clouds)cl.az+=.0003;
 for(const b of birds)b.az+=b.sp;
}

let last=performance.now(),acc=0;
function loop(now){
 if(typeof now!=='number')now=performance.now();
 acc+=Math.min(100,now-last);last=now;
 let n=0;
 while(acc>=STEP&&n<5){update();acc-=STEP;n++}
 if(n===5)acc=0;
 render();
 requestAnimationFrame(loop);
}

fresh();
requestAnimationFrame(loop);
})();
</script>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PIXEL PROBE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#05070b;overflow:hidden;touch-action:none;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:monospace}
#v{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block;touch-action:none;background:#000}
#ui{position:fixed;display:none;pointer-events:none;overflow:hidden;--s:3.6px;z-index:5}
#ui>*{position:absolute}
#look{right:0;top:0;width:52%;height:60%;pointer-events:auto;touch-action:none}
#joy{left:calc(var(--s)*2.5);bottom:calc(var(--s)*4);width:calc(var(--s)*26);height:calc(var(--s)*26);border-radius:50%;
 background:rgba(120,160,190,.10);border:2px solid rgba(210,230,255,.30);pointer-events:auto;touch-action:none}
#stick{position:absolute;left:50%;top:50%;width:38%;height:38%;margin:-19%;border-radius:50%;
 background:rgba(210,235,255,.45);border:2px solid rgba(255,255,255,.7)}
.cb{display:flex;align-items:center;justify-content:center;border-radius:50%;pointer-events:auto;touch-action:none;
 border:2px solid rgba(255,255,255,.45);background:rgba(24,36,40,.45);color:#f2ead0;font:bold calc(var(--s)*2.6) monospace;
 text-shadow:0 1px 2px #000;opacity:.7;padding:0}
.cb.on,.cb.lock{background:rgba(92,138,120,.88);opacity:1}
#atk{right:calc(var(--s)*3);bottom:calc(var(--s)*4);width:calc(var(--s)*15);height:calc(var(--s)*15)}
#use{right:calc(var(--s)*20.5);bottom:calc(var(--s)*4);width:calc(var(--s)*11);height:calc(var(--s)*11)}
#jmp{right:calc(var(--s)*5);bottom:calc(var(--s)*21);width:calc(var(--s)*11);height:calc(var(--s)*11)}
#dsh{right:calc(var(--s)*33);bottom:calc(var(--s)*12);width:calc(var(--s)*10);height:calc(var(--s)*10)}
#blk{right:calc(var(--s)*32);bottom:calc(var(--s)*24);width:calc(var(--s)*11);height:calc(var(--s)*11)}
#off{right:calc(var(--s)*46);bottom:calc(var(--s)*12);width:calc(var(--s)*9);height:calc(var(--s)*9)}
#run{right:calc(var(--s)*19.5);bottom:calc(var(--s)*19.5);width:calc(var(--s)*9);height:calc(var(--s)*9)}
#hotbar{left:50%;bottom:calc(var(--s)*1.5);transform:translateX(-50%);display:flex;gap:calc(var(--s)*.9);pointer-events:none}
.slot{position:relative;width:calc(var(--s)*8.4);height:calc(var(--s)*8.4);padding:0;border:3px solid #0a1014;
 background:rgb(30,44,50);border-radius:0;box-shadow:inset 2px 2px 0 rgba(255,255,255,.28),inset -2px -2px 0 rgba(0,0,0,.35),0 3px 0 rgba(0,0,0,.55);pointer-events:auto;touch-action:none;opacity:.92}
.slot canvas{width:76%;height:76%;image-rendering:pixelated;display:block;margin:auto}
.slot i{position:absolute;left:calc(var(--s)*.7);top:calc(var(--s)*.2);font:bold calc(var(--s)*2.1) monospace;color:#cfe6f8;font-style:normal}
.slot b{position:absolute;right:calc(var(--s)*.6);bottom:calc(var(--s)*.1);font:bold calc(var(--s)*2.3) monospace;color:#fff;text-shadow:0 1px 2px #000}
.slot.sel{border-color:#f6e08a;background:rgba(92,138,120,.85);opacity:1}
#top{left:50%;top:calc(var(--s)*1.5);transform:translateX(-50%);display:flex;gap:calc(var(--s)*1);pointer-events:none}
.tb{width:calc(var(--s)*3.8);height:calc(var(--s)*3.8);padding:calc(var(--s)*.55);display:flex;align-items:center;justify-content:center;position:relative;pointer-events:auto;touch-action:none;border:1px solid rgba(210,222,190,.4);border-radius:calc(var(--s)*.8);
 background:rgba(24,36,40,.4);opacity:.5}
.tb svg{width:100%;height:100%;fill:none;stroke:#f2ead0;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb.off{opacity:.28}
.tb.on{opacity:.95;background:rgba(70,140,110,.6)}
.tb.off::after{content:'';position:absolute;left:18%;right:18%;top:50%;height:2px;background:#f2ead0;transform:rotate(-40deg)}
.slot.no canvas{opacity:.28}
.slot u{position:absolute;left:12%;right:12%;bottom:6%;height:calc(var(--s)*.55);border-radius:1px;display:none;text-decoration:none}
.slot canvas{filter:drop-shadow(1px 0 0 #000) drop-shadow(-1px 0 0 #000) drop-shadow(0 1px 0 #000) drop-shadow(0 -1px 0 #000)}
#ui.kb #joy,#ui.kb #jmp,#ui.kb #run,#ui.kb #dsh,#ui.kb #use,#ui.kb #atk,#ui.kb #blk,#ui.kb #off{display:none}
#ui.kb #look{width:100%;height:100%}
#tbag{left:calc(var(--s)*1.2);top:calc(34% + var(--s)*6);width:calc(var(--s)*5);height:calc(var(--s)*5);opacity:.6}
#tbook{left:calc(var(--s)*1.2);top:34%;width:calc(var(--s)*5);height:calc(var(--s)*5);opacity:.6}
</style>
</head>
<body>
<canvas id="v" width="640" height="360"></canvas>
<div id="ui">
 <div id="look"></div>
 <div id="joy"><div id="stick"></div></div>
 <button id="jmp" class="cb">SALTAR</button>
 <button id="run" class="cb">CORRER</button>
 <button id="dsh" class="cb">ESQUIVAR</button>
 <button id="use" class="cb">E</button>
 <button id="blk" class="cb" style="display:none">ESCUDO</button>
 <button id="off" class="cb">MANO IZQ</button>
 <button id="atk" class="cb">GOLPE</button>
 <div id="hotbar"></div>
 <button id="tbook" class="tb" aria-label="Libro"><svg viewBox="0 0 16 16"><path d="M2.5 3.2c2-.8 3.8-.8 5.5.4v9.2c-1.7-1.2-3.5-1.2-5.5-.4zM13.5 3.2c-2-.8-3.8-.8-5.5.4v9.2c1.7-1.2 3.5-1.2 5.5-.4z"/></svg></button>
 <button id="tbag" class="tb" aria-label="Mochila"><svg viewBox="0 0 16 16"><path d="M5 5.2V4a3 3 0 0 1 6 0v1.2"/><path d="M3.6 5.2h8.8l.8 8.3H2.8z"/><path d="M6 9.2h4"/></svg></button>
 <div id="top">
  <button id="topt" class="tb" aria-label="Opciones"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4L5 11M11 5l1.4-1.4"/></svg></button>
  <button id="tnew" class="tb" aria-label="Nuevo mundo"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.7-3.7"/><path d="M13.2 2.2v3.4H9.8"/></svg></button>
  <button id="tmouse" class="tb" style="display:none" aria-label="Mira del raton"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="4.2"/><path d="M8 1.5v3M8 11.5v3M1.5 8h3M11.5 8h3"/></svg></button>
  <button id="tsnd" class="tb" aria-label="Sonido"><svg viewBox="0 0 16 16"><path d="M2.5 6.2h2.4L8 3.5v9L4.9 9.8H2.5z"/><path d="M10.5 5.6a3.6 3.6 0 0 1 0 4.8M12.4 4a6 6 0 0 1 0 8"/></svg></button>
  <button id="tfs" class="tb" aria-label="Pantalla completa"><svg viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
 </div>
</div>
<script>
window.addEventListener('error',e=>{
 const c=document.getElementById('v');if(!c)return;const g=c.getContext('2d');
 g.fillStyle='#160000';g.fillRect(0,0,640,360);g.fillStyle='#fff';g.font='14px monospace';
 g.fillText('ERROR DEL MOTOR:',20,35);g.fillText(String(e.message).substring(0,70),20,65);
});

function hash2(ix,iy){
 let h=Math.imul(ix,73856093)^Math.imul(iy,19349663);
 h=Math.imul(h^(h>>>13),1274126177);
 return((h^(h>>>16))&1023)/1023;

function vnoise(x,y){
 const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;

 const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
 return a+(b-a)*sx+(cc-a)*sy+(a-b-cc+d)*sx*sy;
}

function genTerrain(){

  let best=-9;

   const dx=x-I.x,dy=y-I.y,d=Math.hypot(dx,dy),an=Math.atan2(dy,dx);
   const R=I.R*(1+.09*Math.sin(an*3+ox)+.06*Math.sin(an*5+oy)+.04*Math.sin(an*9+ox*.7));
   best=Math.max(best,1-d/R);
  }
  {const d0=Math.hypot(x-N/2,y-N/2);best=Math.max(best,Math.min(.5,(1-d0/8.5)*1.6))}
  HG[y*(N+1)+x]=best+(vnoise(x*.16+ox,y*.16+oy)-.5)*.2;
 }
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  let bi=0,bd=1e9;
  for(let k=0;k<4;k++){const d=Math.hypot(x+.5-CEN[k].x,y+.5-CEN[k].y);if(d<bd){bd=d;bi=k}}
  BIO[y*N+x]=Math.hypot(x+.5-N/2,y+.5-N/2)<9?2:bi;
 }
 ICE.fill(0);
 {const o2=rnd()*300,o3=rnd()*300,ICV=new Uint8Array((N+1)*(N+1));
  for(let y=0;y<=N;y++)for(let x=0;x<=N;x++){const i=y*(N+1)+x,h0=HG[i];
   if(BIO[Math.min(N-1,y)*N+Math.min(N-1,x)]!==0||h0>=0||h0<-.5)continue;
   const q=vnoise(x*.11+o2,y*.11+o3)+.35*(vnoise(x*.35+o3,y*.35+o2)-.5);
   if(q>.56){HG[i]=.05+(q-.56)*.2;ICV[i]=1}}
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*(N+1)+x;if(ICV[i]||ICV[i+1]||ICV[i+N+1]||ICV[i+N+2])ICE[y*N+x]=1}}

  if(A.y===B.y){for(let x=A.x;x<=B.x;x++)for(let y=A.y-1;y<=A.y+1;y++)if(hAt(x+.5,y+.5)<.1)BR[y*N+x]=1}

let AC=null,NB=null;
function audio(){
 if(!snd)return null;
 try{
  if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(A)AC=new A()}
  if(AC&&AC.state==='suspended')AC.resume();
 }catch(e){}

}
function tone(f,d,type,vol,slide){
 const a=audio();if(!a)return;
 try{
  const o=a.createOscillator(),v=a.createGain(),t=a.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);
  v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(v);v.connect(a.destination);o.start();o.stop(t+d+.02);
 }catch(e){}
}
function noise(d,vol,fq){
 const a=audio();if(!a)return;
 try{
  if(!NB){
   NB=a.createBuffer(1,(a.sampleRate*.8)|0,a.sampleRate);
   const ch=NB.getChannelData(0);
   for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;
  }
  const s=a.createBufferSource(),fl=a.createBiquadFilter(),v=a.createGain(),t=a.currentTime;
  s.buffer=NB;fl.type='lowpass';fl.frequency.value=fq;
  v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(fl);fl.connect(v);v.connect(a.destination);s.start();s.stop(t+d);
 }catch(e){}
}

function addP(x,y,z,vx,vy,vz,s,col,lvl){

const jit=cl=>[clamp(cl[0]+(Math.random()-.5)*22,0,255),clamp(cl[1]+(Math.random()-.5)*22,0,255),clamp(cl[2]+(Math.random()-.5)*22,0,255)];
function updateParts(){
 for(let i=parts.length-1;i>=0;i--){
  const p=parts[i];
  if(p.st===0){
   p.vz-=.006;
   const nx=p.x+p.vx,ny=p.y+p.vy;
   p.x=nx;p.y=ny;p.z+=p.vz;
   if(p.z<=0){
    p.z=0;p.vz=-p.vz*.35;p.vx*=.55;p.vy*=.55;p.b++;
    if(p.b>=2||p.vz<.012){
     p.st=1;p.vz=0;p.vx=0;p.vy=0;
     p.t=p.lvl===0?30+Math.random()*50:p.lvl===1?20+Math.random()*30:10+Math.random()*25;
    }
   }
  }else if(p.st===1){
   if(--p.t<=0){
    if(p.lvl<2){
     const h=p.s/2;
     for(let k=0;k<4;k++)
      addP(p.x+((k&1)?h/2:-h/2),p.y+((k&2)?h/2:-h/2),p.z,
       (Math.random()-.5)*.012,(Math.random()-.5)*.012,.015+Math.random()*.025,
       h,jit(p.col),p.lvl+1);

    }else p.st=2;

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PIXEL PROBE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#05070b;overflow:hidden;touch-action:none;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:monospace}
#v{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block;touch-action:none;background:#000}
#ui{position:fixed;display:none;pointer-events:none;overflow:hidden;--s:3.6px;z-index:5}
#ui>*{position:absolute}
#look{right:0;top:0;width:52%;height:60%;pointer-events:auto;touch-action:none}
#joy{left:calc(var(--s)*2.5);bottom:calc(var(--s)*4);width:calc(var(--s)*26);height:calc(var(--s)*26);border-radius:50%;
 background:rgba(120,160,190,.10);border:2px solid rgba(210,230,255,.30);pointer-events:auto;touch-action:none}
#stick{position:absolute;left:50%;top:50%;width:38%;height:38%;margin:-19%;border-radius:50%;
 background:rgba(210,235,255,.45);border:2px solid rgba(255,255,255,.7)}
.cb{display:flex;align-items:center;justify-content:center;border-radius:50%;pointer-events:auto;touch-action:none;
 border:2px solid rgba(255,255,255,.45);background:rgba(24,36,40,.45);color:#f2ead0;font:bold calc(var(--s)*2.6) monospace;
 text-shadow:0 1px 2px #000;opacity:.7;padding:0}
.cb.on,.cb.lock{background:rgba(92,138,120,.88);opacity:1}
#atk{right:calc(var(--s)*3);bottom:calc(var(--s)*4);width:calc(var(--s)*15);height:calc(var(--s)*15)}
#use{right:calc(var(--s)*20.5);bottom:calc(var(--s)*4);width:calc(var(--s)*11);height:calc(var(--s)*11)}
#jmp{right:calc(var(--s)*5);bottom:calc(var(--s)*21);width:calc(var(--s)*11);height:calc(var(--s)*11)}
#dsh{right:calc(var(--s)*33);bottom:calc(var(--s)*12);width:calc(var(--s)*10);height:calc(var(--s)*10)}
#blk{right:calc(var(--s)*32);bottom:calc(var(--s)*24);width:calc(var(--s)*11);height:calc(var(--s)*11)}
#off{right:calc(var(--s)*46);bottom:calc(var(--s)*12);width:calc(var(--s)*9);height:calc(var(--s)*9)}
#run{right:calc(var(--s)*19.5);bottom:calc(var(--s)*19.5);width:calc(var(--s)*9);height:calc(var(--s)*9)}
#hotbar{left:50%;bottom:calc(var(--s)*1.5);transform:translateX(-50%);display:flex;gap:calc(var(--s)*.9);pointer-events:none}
.slot{position:relative;width:calc(var(--s)*8.4);height:calc(var(--s)*8.4);padding:0;border:3px solid #0a1014;
 background:rgb(30,44,50);border-radius:0;box-shadow:inset 2px 2px 0 rgba(255,255,255,.28),inset -2px -2px 0 rgba(0,0,0,.35),0 3px 0 rgba(0,0,0,.55);pointer-events:auto;touch-action:none;opacity:.92}
.slot canvas{width:76%;height:76%;image-rendering:pixelated;display:block;margin:auto}
.slot i{position:absolute;left:calc(var(--s)*.7);top:calc(var(--s)*.2);font:bold calc(var(--s)*2.1) monospace;color:#cfe6f8;font-style:normal}
.slot b{position:absolute;right:calc(var(--s)*.6);bottom:calc(var(--s)*.1);font:bold calc(var(--s)*2.3) monospace;color:#fff;text-shadow:0 1px 2px #000}
.slot.sel{border-color:#f6e08a;background:rgba(92,138,120,.85);opacity:1}
#top{left:50%;top:calc(var(--s)*1.5);transform:translateX(-50%);display:flex;gap:calc(var(--s)*1);pointer-events:none}
.tb{width:calc(var(--s)*3.8);height:calc(var(--s)*3.8);padding:calc(var(--s)*.55);display:flex;align-items:center;justify-content:center;position:relative;pointer-events:auto;touch-action:none;border:1px solid rgba(210,222,190,.4);border-radius:calc(var(--s)*.8);
 background:rgba(24,36,40,.4);opacity:.5}
.tb svg{width:100%;height:100%;fill:none;stroke:#f2ead0;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb.off{opacity:.28}
.tb.on{opacity:.95;background:rgba(70,140,110,.6)}
.tb.off::after{content:'';position:absolute;left:18%;right:18%;top:50%;height:2px;background:#f2ead0;transform:rotate(-40deg)}
.slot.no canvas{opacity:.28}
.slot u{position:absolute;left:12%;right:12%;bottom:6%;height:calc(var(--s)*.55);border-radius:1px;display:none;text-decoration:none}
.slot canvas{filter:drop-shadow(1px 0 0 #000) drop-shadow(-1px 0 0 #000) drop-shadow(0 1px 0 #000) drop-shadow(0 -1px 0 #000)}
#ui.kb #joy,#ui.kb #jmp,#ui.kb #run,#ui.kb #dsh,#ui.kb #use,#ui.kb #atk,#ui.kb #blk,#ui.kb #off{display:none}
#ui.kb #look{width:100%;height:100%}
#tbag{left:calc(var(--s)*1.2);top:calc(34% + var(--s)*6);width:calc(var(--s)*5);height:calc(var(--s)*5);opacity:.6}
#tbook{left:calc(var(--s)*1.2);top:34%;width:calc(var(--s)*5);height:calc(var(--s)*5);opacity:.6}
</style>
</head>
<body>
<canvas id="v" width="640" height="360"></canvas>
<div id="ui">
 <div id="look"></div>
 <div id="joy"><div id="stick"></div></div>
 <button id="jmp" class="cb">SALTAR</button>
 <button id="run" class="cb">CORRER</button>
 <button id="dsh" class="cb">ESQUIVAR</button>
 <button id="use" class="cb">E</button>
 <button id="blk" class="cb" style="display:none">ESCUDO</button>
 <button id="off" class="cb">MANO IZQ</button>
 <button id="atk" class="cb">GOLPE</button>
 <div id="hotbar"></div>
 <button id="tbook" class="tb" aria-label="Libro"><svg viewBox="0 0 16 16"><path d="M2.5 3.2c2-.8 3.8-.8 5.5.4v9.2c-1.7-1.2-3.5-1.2-5.5-.4zM13.5 3.2c-2-.8-3.8-.8-5.5.4v9.2c1.7-1.2 3.5-1.2 5.5-.4z"/></svg></button>
 <button id="tbag" class="tb" aria-label="Mochila"><svg viewBox="0 0 16 16"><path d="M5 5.2V4a3 3 0 0 1 6 0v1.2"/><path d="M3.6 5.2h8.8l.8 8.3H2.8z"/><path d="M6 9.2h4"/></svg></button>
 <div id="top">
  <button id="topt" class="tb" aria-label="Opciones"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4L5 11M11 5l1.4-1.4"/></svg></button>
  <button id="tnew" class="tb" aria-label="Nuevo mundo"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.7-3.7"/><path d="M13.2 2.2v3.4H9.8"/></svg></button>
  <button id="tmouse" class="tb" style="display:none" aria-label="Mira del raton"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="4.2"/><path d="M8 1.5v3M8 11.5v3M1.5 8h3M11.5 8h3"/></svg></button>
  <button id="tsnd" class="tb" aria-label="Sonido"><svg viewBox="0 0 16 16"><path d="M2.5 6.2h2.4L8 3.5v9L4.9 9.8H2.5z"/><path d="M10.5 5.6a3.6 3.6 0 0 1 0 4.8M12.4 4a6 6 0 0 1 0 8"/></svg></button>
  <button id="tfs" class="tb" aria-label="Pantalla completa"><svg viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
 </div>
</div>
<script>
window.addEventListener('error',e=>{
 const c=document.getElementById('v');if(!c)return;const g=c.getContext('2d');
 g.fillStyle='#160000';g.fillRect(0,0,640,360);g.fillStyle='#fff';g.font='14px monospace';
 g.fillText('ERROR DEL MOTOR:',20,35);g.fillText(String(e.message).substring(0,70),20,65);
});

function hash2(ix,iy){
 let h=Math.imul(ix,73856093)^Math.imul(iy,19349663);
 h=Math.imul(h^(h>>>13),1274126177);
 return((h^(h>>>16))&1023)/1023;

function vnoise(x,y){
 const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;

 const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
 return a+(b-a)*sx+(cc-a)*sy+(a-b-cc+d)*sx*sy;
}

function genTerrain(){

  let best=-9;

   const dx=x-I.x,dy=y-I.y,d=Math.hypot(dx,dy),an=Math.atan2(dy,dx);
   const R=I.R*(1+.09*Math.sin(an*3+ox)+.06*Math.sin(an*5+oy)+.04*Math.sin(an*9+ox*.7));
   best=Math.max(best,1-d/R);
  }
  {const d0=Math.hypot(x-N/2,y-N/2);best=Math.max(best,Math.min(.5,(1-d0/8.5)*1.6))}
  HG[y*(N+1)+x]=best+(vnoise(x*.16+ox,y*.16+oy)-.5)*.2;
 }
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  let bi=0,bd=1e9;
  for(let k=0;k<4;k++){const d=Math.hypot(x+.5-CEN[k].x,y+.5-CEN[k].y);if(d<bd){bd=d;bi=k}}
  BIO[y*N+x]=Math.hypot(x+.5-N/2,y+.5-N/2)<9?2:bi;
 }
 ICE.fill(0);
 {const o2=rnd()*300,o3=rnd()*300,ICV=new Uint8Array((N+1)*(N+1));
  for(let y=0;y<=N;y++)for(let x=0;x<=N;x++){const i=y*(N+1)+x,h0=HG[i];
   if(BIO[Math.min(N-1,y)*N+Math.min(N-1,x)]!==0||h0>=0||h0<-.5)continue;
   const q=vnoise(x*.11+o2,y*.11+o3)+.35*(vnoise(x*.35+o3,y*.35+o2)-.5);
   if(q>.56){HG[i]=.05+(q-.56)*.2;ICV[i]=1}}
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*(N+1)+x;if(ICV[i]||ICV[i+1]||ICV[i+N+1]||ICV[i+N+2])ICE[y*N+x]=1}}

  if(A.y===B.y){for(let x=A.x;x<=B.x;x++)for(let y=A.y-1;y<=A.y+1;y++)if(hAt(x+.5,y+.5)<.1)BR[y*N+x]=1}

let AC=null,NB=null;
function audio(){
 if(!snd)return null;
 try{
  if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(A)AC=new A()}
  if(AC&&AC.state==='suspended')AC.resume();
 }catch(e){}

}
function tone(f,d,type,vol,slide){
 const a=audio();if(!a)return;
 try{
  const o=a.createOscillator(),v=a.createGain(),t=a.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);
  v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(v);v.connect(a.destination);o.start();o.stop(t+d+.02);
 }catch(e){}
}
function noise(d,vol,fq){
 const a=audio();if(!a)return;
 try{
  if(!NB){
   NB=a.createBuffer(1,(a.sampleRate*.8)|0,a.sampleRate);
   const ch=NB.getChannelData(0);
   for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;
  }
  const s=a.createBufferSource(),fl=a.createBiquadFilter(),v=a.createGain(),t=a.currentTime;
  s.buffer=NB;fl.type='lowpass';fl.frequency.value=fq;
  v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(fl);fl.connect(v);v.connect(a.destination);s.start();s.stop(t+d);
 }catch(e){}
}

function addP(x,y,z,vx,vy,vz,s,col,lvl){

const jit=cl=>[clamp(cl[0]+(Math.random()-.5)*22,0,255),clamp(cl[1]+(Math.random()-.5)*22,0,255),clamp(cl[2]+(Math.random()-.5)*22,0,255)];
function updateParts(){
 for(let i=parts.length-1;i>=0;i--){
  const p=parts[i];
  if(p.st===0){
   p.vz-=.006;
   const nx=p.x+p.vx,ny=p.y+p.vy;
   p.x=nx;p.y=ny;p.z+=p.vz;
   if(p.z<=0){
    p.z=0;p.vz=-p.vz*.35;p.vx*=.55;p.vy*=.55;p.b++;
    if(p.b>=2||p.vz<.012){
     p.st=1;p.vz=0;p.vx=0;p.vy=0;
     p.t=p.lvl===0?30+Math.random()*50:p.lvl===1?20+Math.random()*30:10+Math.random()*25;
    }
   }
  }else if(p.st===1){
   if(--p.t<=0){
    if(p.lvl<2){
     const h=p.s/2;
     for(let k=0;k<4;k++)
      addP(p.x+((k&1)?h/2:-h/2),p.y+((k&2)?h/2:-h/2),p.z,
       (Math.random()-.5)*.012,(Math.random()-.5)*.012,.015+Math.random()*.025,
       h,jit(p.col),p.lvl+1);

    }else p.st=2;

function updateFish(){
 /* mantener un banco de peces alrededor del jugador, solo en agua */
 while(fish.length<30){
  const a=Math.random()<.7?player.a+(Math.random()-.5)*1.7:Math.random()*6.283,r=3+Math.random()*14,x=player.x+Math.cos(a)*r,y=player.y+Math.sin(a)*r;

  if(h>-.07||BR[(y|0)*N+(x|0)]){if(Math.random()<.7)break;continue}
  const dol=h<-.28&&r>6&&Math.random()<.08&&fish.filter(q=>q.sp==='dolphin').length<2;
  fish.push({x,y,dir:Math.random()*6.283,sp:dol?'dolphin':(Math.random()<.35?'koi':'fish'),
   state:'swim',jt:150+Math.random()*600,t:0,z:0,vz:0,fv:.03});
  break;
 }
 for(let i=fish.length-1;i>=0;i--){
  const f=fish[i];
  if(Math.hypot(f.x-player.x,f.y-player.y)>21){fish.splice(i,1);continue}
  if(f.state==='swim'){
   if(Math.random()<.02)f.dir+=(Math.random()-.5)*1.6;
   const sp=f.sp==='dolphin'?.02:.012,nx=f.x+Math.cos(f.dir)*sp,ny=f.y+Math.sin(f.dir)*sp;
   if(hAt(nx,ny)<-.06&&!BR[(ny|0)*N+(nx|0)]){f.x=nx;f.y=ny}else f.dir+=Math.PI*(.6+Math.random()*.8);
   if(--f.jt<=0&&hAt(f.x,f.y)<-.1){
    f.state='jump';f.t=0;

    splash(f.x,f.y,f.sp==='dolphin'?12:6);
   }
  }else{
   f.t++;f.vz-=.0032;f.z+=f.vz;
   f.x+=Math.cos(f.dir)*f.fv;f.y+=Math.sin(f.dir)*f.fv;
   if(f.z<=0){
    f.z=0;f.state='swim';f.jt=200+Math.random()*700;

    ripples.push({x:f.x,y:f.y,t:0});
    if(Math.random()<.4)sfx('splash');
   }
  }
 }
 for(let i=ripples.length-1;i>=0;i--)if(++ripples[i].t>50)ripples.splice(i,1);

 }

 g.beginPath();g.moveTo(A[0],A[1]);g.lineTo(Bp[0],Bp[1]);g.lineTo(C[0],C[1]);g.lineTo(D[0],D[1]);g.closePath();g.fill();

function randCell(b,minH,maxH){
 const I=CEN[b];
 for(let t=0;t<90;t++){
  const a=rnd()*6.283,r=Math.sqrt(rnd())*I.R*1.02;
  const x=Math.floor(I.x+Math.cos(a)*r),y=Math.floor(I.y+Math.sin(a)*r);
  if(x<2||y<2||x>=N-2||y>=N-2)continue;
  const i=y*N+x;
  if(BIO[i]!==b||BR[i]||occ.has(i))continue;
  const h=hAt(x+.5,y+.5);
  if(h<minH||h>maxH)continue;
  if(Math.hypot(x+.5-spawn.x,y+.5-spawn.y)<3)continue;
  let bad=false;
  for(const L of LM)if(inLM(L,x+.5,y+.5,1.3)){bad=true;break}
  if(!bad)for(const Q of POOLS)if(Math.hypot(x+.5-Q.x,y+.5-Q.y)<Q.r+1.5){bad=true;break}
  if(bad)continue;
  occ.add(i);return [x,y];
 }
 return null;
}

function targetObject(range){
 let best=null,bd=range;
 for(const o of objects){
  if(o.state==='falling'||o.type==='pillar'||o.type==='mound'||o.type==='hazard'||o.hidden)continue;
  const dx=o.x-player.x,dy=o.y-player.y,perp=dx*CP+dy*SP;
  if(perp<.1||perp>bd)continue;
  const lat=-dx*SP+dy*CP;
  if(Math.abs(lat)<(o.type==='tree'||o.type==='rock'?.55:o.type==='boss'?.9*o.sc:.4)){best=o;bd=perp;o._d=perp}
 }
 return best;
}

 if(x<1||y<1||x>=N-1||y>=N-1)return false;
 const i=y*N+x;
 if(BR[i]||BLK[i]||blocked.has(i))return false;
 if(hAt(x+.5,y+.5)<.05)return false;
 if(!floor&&Math.floor(player.x)===x&&Math.floor(player.y)===y)return false;
 for(const L of LM)if(inLM(L,x+.5,y+.5,.6))return false;

 if(!floor)for(const o of objects)if(o.cellX===x&&o.cellY===y&&o.type!=='animal')return false;

}

 if(solid(o.x,o.y))ejectObj(o);
 {const mvd=Math.hypot(o.x-(o.lx===undefined?o.x:o.lx),o.y-(o.ly===undefined?o.y:o.ly));o.lx=o.x;o.ly=o.y;
  if(mvd<sp*.25)o.stk=(o.stk||0)+1;else o.stk=Math.max(0,(o.stk||0)-2);
  if(o.stk>22&&!(o.dtT>0)){o.dtT=90;o.dsg=Math.random()<.5?1:-1;o.stk=0}
  if(o.dtT>0){o.dtT--;ang+=o.dsg*1.25}}
 const tries=[0,.5,-.5,1,-1,1.6,-1.6,2.4];
 for(const t of tries){
  const a=ang+t;

 }

}

function updateBandit(o){

 }
 if(d>70){const i=objects.indexOf(o);if(i>=0)objects.splice(i,1);return}
 if(plWet()&&(o.state==='chase'||o.state==='windup'||o.state==='strike'||o.state==='recover'||o.state==='retreat'||o.state==='stagger')){o.state='idle';o.wind=0;o.atk=0}
 if(o.state==='idle'){

 }
 if(o.state==='chase'){

 }else if(o.state==='retreat'){

  if(o.stg<=0)o.state='chase';
 }else if(o.state==='recover'){
  o.dir=toP;o.stg--;

 }else if(o.state==='stagger'){
  o.stg--;if(o.stg<=0)o.state='chase';
 }else if(o.state==='flee'){

   }else if(o.fleeT<-600)o.state='hide';

   if(o.fleeT<-900)o.state='hide';
  }
 }
 if(o.state==='hide'){

function updateArrows(){
 for(let i=arrows.length-1;i>=0;i--){
  const a=arrows[i];
  if(a.state==='stuck'){
   if(!a.foe&&Math.hypot(a.x-player.x,a.y-player.y)<.95&&player.z<.4){give('arrow',1);arrows.splice(i,1);sfx('pick');say('FLECHA RECOGIDA');continue}
   if(--a.life<=0)arrows.splice(i,1);
   continue;
  }
  let gone=false;
  for(let k=0;k<2&&!gone;k++){
   a.vz-=.0011;
   a.x+=a.vx*.5;a.y+=a.vy*.5;a.z+=a.vz*.5;
   if(a.x<.3||a.y<.3||a.x>N-.3||a.y>N-.3){gone=true;break}
   const bi=(a.y|0)*N+(a.x|0);
   if(BLK[bi]&&BLK[bi]!==6){a.x-=a.vx;a.y-=a.vy;a.state='stuck';a.life=a.foe?420:3600;a.z=Math.max(.05,a.z);sfx('arrowhit');gone=true;break}
   if(a.z<=0){a.z=.02;a.state='stuck';a.life=a.foe?420:3600;if(a.dmg)sfx('arrowhit');gone=true;break}
   if(a.foe){if(state==='play'&&Math.hypot(a.x-player.x,a.y-player.y)<.45&&a.z>-.05&&a.z<1){hurtPlayer(1,Math.atan2(player.y-a.y,player.x-a.x),true);say('¡TE HAN ACERTADO!');gone=true;break}continue}
   if(a.dmg<=0)continue;
   for(const o of objects){
    if(o.hidden)continue;
    const dx=o.x-a.x,dy=o.y-a.y;
    if(o.type==='boss'){if(Math.hypot(dx,dy)<.95*o.sc&&a.z<2.6*o.sc){hitBoss(o,a.dmg+1);hit1(a,i,o);gone=true;break}continue}
    if(dx>1||dx<-1||dy>1||dy<-1)continue;
    const d=Math.hypot(dx,dy);
    if(o.type==='animal'&&d<.38&&a.z<.75){hitAnimal(o,a.dmg);hit1(a,i,o);gone=true;break}
    if(o.type==='enemy'&&d<.4&&a.z<.9){hitEnemy(o,a.dmg);hit1(a,i,o);gone=true;break}
    if(o.type==='wraith'&&d<.5&&a.z<1.2){hitWraith(o);hit1(a,i,o);gone=true;break}
    if(o.type==='raider'&&d<.45&&a.z<.95){hitRaider(o,a.dmg+1);hit1(a,i,o);gone=true;break}
    if(o.type==='chestrun'&&d<.4&&a.z<.5){hitChest(o,a.dmg);hit1(a,i,o);gone=true;break}
    if((o.type==='tree'&&d<.28&&a.z<1.3)||(o.type==='rock'&&d<.4&&a.z<.5)||(o.type==='pillar'&&d<.3&&a.z<.5)||(o.type==='placed'&&d<.4&&a.z<.5&&o.kind!=='torch')){
     a.state='stuck';a.life=3600;a.vx=a.vy=a.vz=0;sfx('arrowhit');puff(a.x,a.y,[[150,110,70]],3,2,.1);gone=true;break;
    }
   }
  }
  if(gone&&a.state!=='stuck')arrows.splice(i,1);
 }
}

function updateWeather(){
 if(state!=='play')return;
 const b=curBio>=0?curBio:2,w=weather;
 if(!w.force){
  if(--w.t<=0){
   if(b===2&&!w.active){

    if(Math.random()<.3){w.active=true;w.t=1100+Math.random()*2200}else w.t=1800+Math.random()*5400;
   }else{
    w.active=!w.active;

   }
  }
 }
 const want=w.force?w.type:(w.active||b===1?WTYPE[b]:'none');
 if(w.type===want)w.k=Math.min(w.force?1:(w.type==='ash'?.55:1),w.k+.004);
 else{w.k-=.01;if(w.k<=0){w.k=0;w.type=want}}

 /* gotas de nieve / lluvia: mover */

  else if(w.type==='snow'){d.y+=1.4*d.z;d.x+=Math.sin(d.p)*.8+(w.gustX||0)*d.z}
  else if(w.type==='sand'){d.x+=15*d.z;d.y+=Math.sin(d.p*2)*1.2+.6}

  if(d.x>W+10)d.x=-10;if(d.x<-12)d.x=W+8;
 }
 /* rafagas de aire frio */
 if(w.type==='snow'&&w.k>.25&&Math.random()<.0045*w.k){
  const dir=Math.random()<.5?1:-1;
  w.gust.push({x:dir>0?-120:W+120,y:40+Math.random()*250,v:dir*(9+Math.random()*6),len:90+Math.random()*120,life:0,wob:Math.random()*6});
  w.gustX=dir*1.4;sfx('gust');
 }
 for(let i=w.gust.length-1;i>=0;i--){
  const q=w.gust[i];q.x+=q.v;q.life++;
  if(q.x<-300||q.x>W+300)w.gust.splice(i,1);
 }
 if(!w.gust.length)w.gustX=0;
 /* tormenta */

const MU={ctx:null,master:null,calm:null,tens:null,rev:null,wind:null,rain:null,rum:null,nc:0,nt:0,t:0,bar:0,beat:0,tb:0,ready:false,

const ROOTS=[293.66,174.61,261.63,220];
const mf=(root,semi)=>root*Math.pow(2,semi/12);
function musicInit(){
 if(MU.ready||!snd)return;
 const a=audio();if(!a)return;
 try{
  const m=a.createGain();m.gain.value=0;m.connect(a.destination);MU.master=m;
  MU.calm=a.createGain();MU.calm.gain.value=1;MU.tens=a.createGain();MU.tens.gain.value=0;
  const conv=a.createConvolver(),len=a.sampleRate*2.6,ib=a.createBuffer(2,len,a.sampleRate);
  for(let c=0;c<2;c++){const d=ib.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
  conv.buffer=ib;const rg=a.createGain();rg.gain.value=.55;conv.connect(rg);rg.connect(m);MU.rev=conv;
  MU.calm.connect(m);MU.calm.connect(conv);MU.tens.connect(m);
  /* ruido continuo: viento, lluvia, rumor */
  const nb=a.createBuffer(1,a.sampleRate*3,a.sampleRate),nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  const loop=()=>{const s=a.createBufferSource();s.buffer=nb;s.loop=true;s.start();return s};
  const mkN=(type,f,q,vol)=>{const s=loop(),fl=a.createBiquadFilter(),gn=a.createGain();fl.type=type;fl.frequency.value=f;fl.Q.value=q;gn.gain.value=0;s.connect(fl);fl.connect(gn);gn.connect(m);return {gn,fl,vol}};
  MU.wind=mkN('bandpass',520,.7,.5);MU.rain=mkN('highpass',2600,.4,.3);MU.rum=mkN('lowpass',110,1,.9);
  MU.nc=a.currentTime+.2;MU.nt=a.currentTime+.2;MU.ready=true;MU.ctx=a;
 }catch(e){MU.ready=false}
}
function muteMusic(){if(MU.master)MU.master.gain.setTargetAtTime(0,MU.ctx.currentTime,.1)}
function mnote(bus,f,t,d,type,vol,att){
 const a=MU.ctx,o=a.createOscillator(),gn=a.createGain();
 o.type=type;o.frequency.value=f;
 gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol,t+(att||.02));gn.gain.exponentialRampToValueAtTime(.0008,t+d);
 o.connect(gn);gn.connect(bus);o.start(t);o.stop(t+d+.05);
}
function updateMusic(){
 if(state==='title'){return}
 if(!snd){if(MU.ready)muteMusic();return}
 if(!MU.ready){musicInit();if(!MU.ready)return}

 const ten=tensionNear()?1:0;
 MU.t+=(ten-MU.t)*.012;

 MU.master.gain.setTargetAtTime(menu?.35:.7,now,.2);
 MU.calm.gain.setTargetAtTime(1-MU.t,now,.3);MU.tens.gain.setTargetAtTime(MU.t,now,.2);

  rv=w.type==='rain'?w.k:0,ev=Math.max(w.eK||0,w.erupt>0?.5:0);
 MU.wind.gn.gain.setTargetAtTime(wv*.5*.35+(.012),now,.4);

 MU.rain.gn.gain.setTargetAtTime(rv*.16,now,.4);
 MU.rum.gn.gain.setTargetAtTime(ev*.55,now,.3);

 const sc=SCALES[b],root=ROOTS[b]*(b===1?1:1);
 if(1-MU.t>.05){
  const beatLen=b===0?1.25:b===1?1.15:1.05;
  let guard=0;
  while(MU.nc<now+.5&&guard++<8){
   const t=MU.nc,beat=MU.beat%8,chord=MU.chords[((MU.beat/8)|0)%4];
   if(beat===0){
    for(let i=0;i<3;i++){mnote(MU.calm,mf(root/2,sc[(chord[i]%12)%sc.length]||chord[i]),t+i*.05,beatLen*7.2,'sine',.04,1.4)}
    mnote(MU.calm,mf(root/4,chord[0]),t,beatLen*8,'sine',.05,.8);
   }
   if(Math.random()<.62){
    const n=sc[(Math.random()*sc.length)|0]+(Math.random()<.5?12:0)+(Math.random()<.2?12:0);
    mnote(MU.calm,mf(root,n),t+Math.random()*.1,1.8,'triangle',.06,.012);
   }

   }
   MU.nc+=beatLen;MU.beat++;
  }
 }
 if(MU.t>.05){
  const tl=.46;
  let guard=0;
  while(MU.nt<now+.5&&guard++<10){
   const t=MU.nt,s=MU.tb%16,minor=[0,3,5,7,8,10,12];

   }
   if(s%4===0){mnote(MU.tens,58,t,.35,'sine',.28,.005);if(s%8===0)mnote(MU.tens,58,t+tl*.5,.3,'sine',.2,.005)}
   if(s%4===2||(s===13)){
    const n=minor[(Math.random()*minor.length)|0],f=mf(root*2,n);
    mnote(MU.tens,f,t,.22,'sawtooth',.05,.004);mnote(MU.tens,f*1.0595,t,.22,'sawtooth',.03,.004);
   }
   MU.nt+=tl/2;MU.tb++;
  }
 }else{MU.nt=Math.max(MU.nt,now)}
 if(MU.t<=.05)MU.nc=Math.max(MU.nc,now-.1);
}

let perfAvg=16,perfN=0,perfCool=300;
function perfTick(dt){
 if(state!=='play'||menu)return;
 perfAvg+=(Math.min(120,dt)-perfAvg)*.04;
 if(perfCool>0){perfCool--;return}
 return;
 if(++perfN<90)return;
 perfN=0;
 if(perfAvg>27){
  let ch=false;
  if(OPT.fx>1){OPT.fx=1;ch=true}
  else if(OPT.res<1){OPT.res=1;setFloorRes(1);ch=true}
  else if(OPT.shadow<1){OPT.shadow=1;ch=true}
  else if(OPT.fx>0){OPT.fx=0;ch=true}
  else if(OPT.res<2){OPT.res=2;setFloorRes(2);ch=true}
  else if(OPT.foam){OPT.foam=0;ch=true}
  else if(INKON){OPT.ink=0;INKON=false;ch=true}
  else if(OPT.grid){OPT.grid=0;ch=true}
  else if(OPT.shadow<2){OPT.shadow=2;ch=true}
  if(ch){saveOpt();perfCool=240;say('CALIDAD AJUSTADA PARA IR MAS FLUIDO')}
 }
}
